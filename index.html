function drawMegaTrampoline(x, y, w, h, squash=0){
  const cx = x + w / 2;
  ctx.strokeStyle = '#546E7A'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x + 18, y + 16); ctx.lineTo(x + 10, y + h);
  ctx.moveTo(x + 44, y + 16); ctx.lineTo(x + 36, y + h);
  ctx.moveTo(x + w - 44, y + 16); ctx.lineTo(x + w - 36, y + h);
  ctx.moveTo(x + w - 18, y + 16); ctx.lineTo(x + w - 10, y + h);
  ctx.stroke();

  rrect(x, y + 6, w, 14, 7); ctx.fillStyle = '#FC3BA0'; ctx.fill();
  rect(x + 4, y + 8, w - 8, 3, '#FF80AB');
  for(let sx = x + 16; sx < x + w - 10; sx += 28){
    disc(sx, y + 13, 2.5, 2.5, '#FFEB3B');
  }

  const sq = Math.min(14, squash);
  ctx.fillStyle = '#1A1A1D'; ctx.beginPath();
  ctx.moveTo(x + 14, y + 8);
  ctx.quadraticCurveTo(cx, y + 10 + sq, x + w - 14, y + 8);
  ctx.lineTo(x + w - 14, y + 14);
  ctx.quadraticCurveTo(cx, y + 16 + sq, x + 14, y + 14);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = '#03F9FC'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, y + 11 + sq, 7, 0, Math.PI * 2);
  ctx.moveTo(cx - 10, y + 11 + sq); ctx.lineTo(cx + 10, y + 11 + sq);
  ctx.stroke();

  if(!doodleTrampolineUsed){
    const bounceY = Math.sin(frame * 0.1) * 3;
    rrect(cx - 46, y - 28 + bounceY, 92, 20, 5); ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = COL.hud; ctx.stroke();
    text('★ JUMP IN! ★', cx, y - 24 + bounceY, 1.4, COL.hud, 'c', null, true);
  }
}

function drawSchoolGate(x, y, w, h, timer=0){
  const pw = 30;
  rrect(x, y, pw, h, 3); ctx.fillStyle = '#C62828'; ctx.fill();
  for(let py = y + 10; py < y + h - 10; py += 12) rect(x, py, pw, 1.5, '#EF9A9A');
  rrect(x - 3, y - 6, pw + 6, 8, 2); ctx.fillStyle = '#ECEFF1'; ctx.fill();
  disc(x + pw/2, y - 14, 8, 8, '#ECEFF1'); disc(x + pw/2 - 2, y - 16, 3, 3, '#FFFFFF');

  const rx = x + w - pw;
  rrect(rx, y, pw, h, 3); ctx.fillStyle = '#C62828'; ctx.fill();
  for(let py = y + 10; py < y + h - 10; py += 12) rect(rx, py, pw, 1.5, '#EF9A9A');
  rrect(rx - 3, y - 6, pw + 6, 8, 2); ctx.fillStyle = '#ECEFF1'; ctx.fill();
  disc(rx + pw/2, y - 14, 8, 8, '#ECEFF1'); disc(rx + pw/2 - 2, y - 16, 3, 3, '#FFFFFF');

  ctx.fillStyle = '#37474F';
  ctx.beginPath();
  ctx.moveTo(x + pw, y + 14); ctx.quadraticCurveTo(x + w/2, y - 10, rx, y + 14);
  ctx.lineTo(rx, y + 26); ctx.quadraticCurveTo(x + w/2, y + 2, x + pw, y + 26);
  ctx.closePath(); ctx.fill();
  text('SCHOOL EXIT', x + w/2, y + 12, 1.3, '#FFFFFF', 'c');

  const openRatio = timer > 40 ? Math.min(1, (timer - 40) / 45) : 0;
  const gateW = (w - pw * 2) / 2;
  const leftDoorOpenW = gateW * (1 - openRatio * 0.85);
  const rightDoorOpenW = gateW * (1 - openRatio * 0.85);

  ctx.strokeStyle = '#263238'; ctx.lineWidth = 2.5;
  rect(x + pw, y + 30, leftDoorOpenW, h - 30, 'rgba(0,0,0,0.08)');
  for(let gx = x + pw + 6; gx < x + pw + leftDoorOpenW - 2; gx += 12){
    rect(gx, y + 30, 2, h - 30, '#37474F');
  }

  rect(rx - rightDoorOpenW, y + 30, rightDoorOpenW, h - 30, 'rgba(0,0,0,0.08)');
  for(let gx = rx - rightDoorOpenW + 6; gx < rx - 2; gx += 12){
    rect(gx, y + 30, 2, h - 30, '#37474F');
  }
}

// ================= Sky-High Doodle Jump Mini-game =================
function startSkyDoodleMiniGame(player){
  savedL3State = {
    camX: camX,
    checkpoint: checkpoint,
    trophies: trophies.slice(),
    enemies: enemies.map(e => ({...e})),
    pickups: pickups.map(p => ({...p})),

    players: players.map(p => ({
      id: p.id,
      src: p.src,
      lives: p.lives,
      out: p.out,
      bx: p.b.x,
      by: p.b.y,
      face: p.b.face
    })),
    score: score,
    leftWall: leftWall,
    rightWall: rightWall
  };

  state = 'doodle';
  stateT = 0;
  doodleTimer = 2800; // ~46.6s
  doodlePts = 0;
  doodleCombo = 1;
  doodleComboTimer = 0;
  doodleMaxCombo = 1;
  doodleAlt = 0;
  doodleMaxAlt = 0;
  doodleSkyAlt = 0;
  doodleCamY = 0;
  doodlePhase = 'play';
  doodleFinishTimer = 0;
  doodleFx = [];
  doodlePickups = [];
  doodlePlatforms = [];
  doodleTrampolineUsed = true;

  // Base platform
  doodlePlatforms.push({x: WNAT/2 - 65, y: 460, w: 130, h: 14, t: 'wood', squash: 0, vx: 0});

  // Spawn initial platform staircase up to -1400
  let curY = 380, isFirst = true;
  while(curY > -1400){
    const pw = 85 + Math.random() * 30;
    const px = isFirst ? (WNAT/2 - pw/2) : (40 + Math.random() * (WNAT - 80 - pw));
    isFirst = false;
    const alt = Math.floor((460 - curY) / 3.2);
    const t = alt < 400 ? (Math.random() < 0.22 ? 'spring' : (Math.random() < 0.2 ? 'tire' : 'wood')) :
              alt < 800 ? (Math.random() < 0.22 ? 'balloon' : (Math.random() < 0.25 ? 'cloud_spring' : (Math.random() < 0.15 ? 'rainbow' : 'cloud'))) :
              (Math.random() < 0.22 ? 'star_spring' : (Math.random() < 0.2 ? 'ufo' : (Math.random() < 0.2 ? 'moon_rock' : 'satellite')));
    doodlePlatforms.push({x: px, y: curY, w: pw, h: 14, t: t, squash: 0, vx: 0});

    // Generous cheese pickups so players have plenty of opportunities to score
    if(Math.random() < 0.85){
      const pkT = Math.random() < 0.18 ? 'wheel' : (Math.random() < 0.08 ? 'diamond' : 'cheese');
      const basePts = pkT === 'diamond' ? 1000 : (pkT === 'wheel' ? 300 : 100);
      doodlePickups.push({t: pkT, x: px + pw/2, y: curY - 24, basePts: basePts, taken: false, ph: Math.random()*6});
      if(pw > 100 && Math.random() < 0.5){
        doodlePickups.push({t: 'cheese', x: px + pw * 0.25, y: curY - 24, basePts: 100, taken: false, ph: Math.random()*6});
      }
    }
    curY -= (46 + Math.random() * 18);
  }

  // Position mice for controlled initial launch
  const live = alivePlayers();
  live.forEach((p, k) => {
    p.b.x = WNAT / 2 + (k - (live.length - 1)/2) * 32;
    p.b.y = 440;
    p.b.vx = 0;
    p.b.vy = -11.5;
    p.b.ground = false;
    p.parachute = false;
  });

  sfx('spring_super');
}

function restoreL3State(bonusPts){
  if(!savedL3State) return;
  camX = savedL3State.camX;
  checkpoint = savedL3State.checkpoint;
  trophies = savedL3State.trophies.slice();
  enemies = savedL3State.enemies.map(e => ({...e}));
  pickups = savedL3State.pickups.map(p => ({...p}));
  crates = savedL3State.crates.map(c => ({...c}));
  shots = savedL3State.shots.map(s => ({...s}));
  fx = savedL3State.fx.map(f => ({...f}));
  leftWall = savedL3State.leftWall;
  rightWall = savedL3State.rightWall;
  score = savedL3State.score;

  const trampCenterX = 2620 + 65;
  const liveCount = savedL3State.players.filter(p => !p.out).length;
  let liveIdx = 0;

  players = savedL3State.players.map((sp, k) => {
    const p = {
      id: sp.id,
      src: sp.src,
      lives: sp.lives,
      out: sp.out,
      b: newBody(sp.id, trampCenterX, -80),
      jq: false,
      upPressed: false,
      prevUp: false,
      parachute: false
    };
    if(!p.out){
      const off = (liveIdx - (liveCount - 1) / 2) * 28;
      p.b.x = trampCenterX + off;
      p.b.y = -80 - liveIdx * 18;
      p.b.vx = 0;
      p.b.vy = 1.6;
      p.b.ground = false;
      p.b.inv = 120;
      p.b.face = 1;
      p.parachute = true;
      liveIdx++;
    }
    return p;
  });

  if(bonusPts > 0){
    addScore(bonusPts, trampCenterX, FEET - 120);
    fx.push({t:'pts', x: trampCenterX, y: FEET - 140, txt: '+' + bonusPts + ' SKY BONUS!', age: 0, big: true});
    fx.push({t:'star', x: trampCenterX, y: FEET - 100, age: 0});
  }

  doodleTrampolineUsed = true;
  savedL3State = null;
  state = 'play';
  stateT = 0;
  parachuteDescentActive = true;
  setTrack('street');
}

function tickDoodle(){
  // Step fx
  for(let i = doodleFx.length - 1; i >= 0; i--){
    const f = doodleFx[i]; f.age++;
    if(f.age > 45) doodleFx.splice(i, 1);
  }

  // Squashing platforms
  for(const pl of doodlePlatforms) if(pl.squash > 0) pl.squash--;

  if(doodlePhase === 'finish'){
    doodleFinishTimer--;
    for(const p of alivePlayers()){
      p.b.vy = Math.min(1.8, p.b.vy + 0.05); // Parachute float
      p.b.y += p.b.vy;
      p.b.x += Math.sin(frame * 0.08 + p.b.y * 0.02) * 0.8;
      p.parachute = true;
    }
    if(doodleFinishTimer <= 0){
      restoreL3State(doodlePts);
      return;
    }
    return;
  }

  doodleTimer--;
  if(doodleTimer <= 0){
    doodleTimer = 0;
    doodlePhase = 'finish';
    doodleFinishTimer = 140;
    sfx('trophy');
    for(let i = 0; i < 40; i++) confetti.push({x: WNAT/2+(Math.random()-0.5)*300, y: -10, vx: (Math.random()-0.5)*3, vy: 1+Math.random()*3, r: 0, vr: 0.1, c: COL.hud, s: 'r', w: 8});
    return;
  }

  // Combo timer
  if(doodleComboTimer > 0){
    doodleComboTimer--;
    if(doodleComboTimer === 0) doodleCombo = 1;
  }

  // Update moving platforms
  for(const pl of doodlePlatforms){
    if(pl.vx){
      pl.x += pl.vx;
      if(pl.x < 30 || pl.x + pl.w > WNAT - 30) pl.vx *= -1;
    }
  }

  // Player physics & inputs
  const live = alivePlayers();
  for(const p of live){
    const s = srcCur[p.src] || {dx:0, a:false, b:false};
    const b = p.b;
    if(s.dx !== 0){
      b.vx += s.dx * 0.48;
      b.face = Math.sign(s.dx);
    } else {
      b.vx *= 0.90;
    }
    b.vx = Math.max(-5.5, Math.min(5.5, b.vx));
    b.x += b.vx;

    // Screen wrap (classic Doodle Jump!)
    if(b.x < -16) b.x = WNAT + 10;
    else if(b.x > WNAT + 16) b.x = -10;

    // Gentle floaty gravity for readable, enjoyable jumps
    b.vy += 0.34;
    if(b.vy > 9.5) b.vy = 9.5;
    b.y += b.vy;

    // Platform bounce collision (when falling down)
    if(b.vy > 0){
      for(const pl of doodlePlatforms){
        if(b.x + 16 > pl.x && b.x - 16 < pl.x + pl.w && b.y >= pl.y - 3 && b.y - b.vy <= pl.y + 14){
          pl.squash = 8;
          b.y = pl.y;
          if(pl.t === 'star_spring'){
            b.vy = -14.5;
            sfx('spring_super');
            for(let i=0; i<6; i++) doodleFx.push({t:'star', x: b.x + (Math.random()-0.5)*20, y: pl.y, age: 0, small: true});
          } else if(pl.t === 'spring' || pl.t === 'cloud_spring' || pl.t === 'rainbow' || pl.t === 'ufo'){
            b.vy = -13.2;
            sfx('spring_super');
            for(let i=0; i<5; i++) doodleFx.push({t:'star', x: b.x + (Math.random()-0.5)*20, y: pl.y, age: 0, small: true});
          } else if(pl.t === 'balloon' || pl.t === 'tire'){
            b.vy = -11.8;
            sfx('spring');
            for(let i=0; i<4; i++) doodleFx.push({t:'spark', x: b.x + (Math.random()-0.5)*20, y: pl.y, age: 0});
          } else {
            b.vy = -10.2;
            sfx('jump');
            for(let i=0; i<3; i++) doodleFx.push({t:'spark', x: b.x + (Math.random()-0.5)*20, y: pl.y, age: 0});
          }

          // Combo
          doodleCombo = Math.min(8, doodleCombo + 1);
          doodleComboTimer = 110;
          if(doodleCombo > doodleMaxCombo) doodleMaxCombo = doodleCombo;
          sfxCombo(doodleCombo);
          const bouncePts = 50 * doodleCombo;
          doodlePts += bouncePts;
          if(doodleCombo >= 4){
            doodleFx.push({t:'pts', x: b.x, y: pl.y - 28, txt: doodleCombo + 'x FRENZY!', age: 0, big: true, col: COL.hud});
          }
          break;
        }
      }
    }

    // Safety Bottom Net / Updraft Cushion
    if(b.y > doodleCamY + HNAT - 25){
      b.vy = -11.5;
      b.y = doodleCamY + HNAT - 26;
      sfx('spring');
      doodleCombo = 1; doodleComboTimer = 0;
      doodleFx.push({t:'pts', x: b.x, y: b.y - 28, txt: 'SAFETY BOUNCE!', age: 0, col: COL.gold});
    }

    // Pickup collisions (generous pickup radius for easy cheese grabs)
    for(const pk of doodlePickups){
      if(pk.taken) continue;
      if(Math.hypot(b.x - pk.x, (b.y - 36) - pk.y) < 38){
        pk.taken = true;
        const pts = pk.basePts * doodleCombo;
        doodlePts += pts;
        sfx('cheese');
        // Time bonuses: diamond +3.0s, wheel +1.5s, cheese +0.5s!
        const timeBonus = pk.t === 'diamond' ? 180 : (pk.t === 'wheel' ? 90 : 30);
        doodleTimer += timeBonus;
        const timeBonusSec = (timeBonus / 60).toFixed(1);
        doodleFx.push({t:'pts', x: pk.x, y: pk.y - 15, txt: '+' + pts, age: 0, big: (doodleCombo >= 4)});
        doodleFx.push({t:'pts', x: pk.x, y: pk.y - 30, txt: '+' + timeBonusSec + 's TIME!', age: 0, col: '#00E5FF'});
        doodleFx.push({t:'star', x: pk.x, y: pk.y, age: 0, small: false});
      }
    }
  }

  // Camera tracking: scrolls up smoothly and deliberately
  const minPlayerY = Math.min(...live.map(p => p.b.y));
  const targetCamY = minPlayerY - 290;
  if(targetCamY < doodleCamY) doodleCamY += (targetCamY - doodleCamY) * 0.12;

  // Track altitude
  const curAlt = Math.max(0, Math.floor((460 - minPlayerY) / 3.2));
  if(curAlt > doodleMaxAlt) doodleMaxAlt = curAlt;
  doodleAlt = curAlt;
  // Monotonically non-decreasing sky altitude: once a new sky style is entered, it can NEVER revert!
  if(curAlt > doodleSkyAlt) doodleSkyAlt = curAlt;

  // Cosmic Apex Finish at 1200m!
  if(doodleAlt >= 1200 && doodlePhase === 'play'){
    doodlePhase = 'finish';
    doodleFinishTimer = 180;
    doodlePts += 5000;
    doodleMaxAlt = 1200;
    sfx('trophy');
    doodleFx.push({t:'pts', x: WNAT/2, y: doodleCamY + 200, txt: '★ COSMIC APEX! +5000 ★', age: 0, big: true, col: COL.hud});
    for(let i = 0; i < 50; i++) confetti.push({x: WNAT/2+(Math.random()-0.5)*320, y: -10, vx: (Math.random()-0.5)*3.5, vy: 1+Math.random()*3, r: 0, vr: 0.1, c: COL.hud, s: 'r', w: 8});
    return;
  }

  // Dynamic Procedural Platform Spawning Ahead
  let minPlY = Math.min(...doodlePlatforms.map(p => p.y));
  while(minPlY > doodleCamY - 350){
    const nextY = minPlY - (46 + Math.random() * 18);
    const pw = 85 + Math.random() * 30;
    const px = 30 + Math.random() * (WNAT - 60 - pw);
    const alt = Math.floor((460 - nextY) / 3.2);

    let t = 'wood', vx = 0;
    if(alt < 400){
      const roll = Math.random();
      if(roll < 0.22) t = 'spring';
      else if(roll < 0.40) t = 'tire';
      else if(roll < 0.55){ t = 'wood'; vx = (Math.random() < 0.5 ? 1 : -1) * 1.3; }
      else t = 'wood';
    } else if(alt < 800){
      const roll = Math.random();
      if(roll < 0.22) t = 'balloon';
      else if(roll < 0.40) t = 'cloud_spring';
      else if(roll < 0.52) t = 'rainbow';
      else if(roll < 0.68){ t = 'cloud'; vx = (Math.random() < 0.5 ? 1 : -1) * 1.5; }
      else t = 'cloud';
    } else {
      const roll = Math.random();
      if(roll < 0.22) t = 'star_spring';
      else if(roll < 0.40) t = 'ufo';
      else if(roll < 0.55) t = 'moon_rock';
      else if(roll < 0.70){ t = 'satellite'; vx = (Math.random() < 0.5 ? 1 : -1) * 1.6; }
      else t = 'satellite';
    }

    doodlePlatforms.push({x: px, y: nextY, w: pw, h: 14, t: t, squash: 0, vx: vx});

    // Spawning generous cheese / pickups
    if(Math.random() < 0.85){
      const pkT = Math.random() < 0.18 ? 'wheel' : (Math.random() < 0.08 ? 'diamond' : 'cheese');
      const basePts = pkT === 'diamond' ? 1000 : (pkT === 'wheel' ? 300 : 100);
      doodlePickups.push({t: pkT, x: px + pw/2, y: nextY - 24, basePts: basePts, taken: false, ph: Math.random()*6});
      if(pw > 100 && Math.random() < 0.5){
        doodlePickups.push({t: 'cheese', x: px + pw * 0.25, y: nextY - 24, basePts: 100, taken: false, ph: Math.random()*6});
      }
    }

    minPlY = nextY;
  }

  // Cull old platforms and pickups
  doodlePlatforms = doodlePlatforms.filter(p => p.y < doodleCamY + HNAT + 120);
  doodlePickups = doodlePickups.filter(pk => pk.y < doodleCamY + HNAT + 120);
}

function renderDoodle(){
  ctx.save();
  // 1. Dynamic Sky / Space Background with smooth fading based on locked Sky Altitude
  drawDoodleSky(doodleSkyAlt);

  // 2. Platforms
  for(const pl of doodlePlatforms){
    drawDoodlePlatform(pl);
  }

  // 3. Pickups
  for(const pk of doodlePickups){
    if(pk.taken) continue;
    const py = pk.y - doodleCamY + Math.sin(frame * 0.1 + pk.ph) * 3;
    if(pk.t === 'wheel') drawCheeseWheel(pk.x, py);
    else if(pk.t === 'diamond') drawDiamondCheese(pk.x, py);
    else drawCheese(pk.x, py);
  }

  // 4. Players
  for(const p of alivePlayers()){
    const b = p.b;
    const sy = b.y - doodleCamY;
    if(p.parachute){
      drawDoodleParachute(b.x, sy);
    }
    drawMouse(p.id, b.x + camX, sy, b.face, b.vy < 0 ? 'jump' : 'idle');
  }

  // 5. Particles / Fx
  for(const f of doodleFx){
    const sy = f.y - doodleCamY;
    if(f.t === 'pts'){
      ctx.globalAlpha = Math.max(0, 1 - f.age / 45);
      text(f.txt, f.x, sy - f.age * 0.8, f.big ? 2.4 : 1.6, f.col || COL.gold, 'c', '#000', true);
      ctx.globalAlpha = 1;
    } else if(f.t === 'spark'){
      disc(f.x, sy, 3, 3, COL.gold);
    } else if(f.t === 'star'){
      disc(f.x, sy, 4, 4, '#FFF');
    }
  }

  // 6. Finish Confetti
  if(doodlePhase === 'finish'){
    for(const p of confetti){
      ctx.save(); ctx.translate(R(p.x), R(p.y)); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if(p.s === 'r') ctx.fillRect(-p.w/2, -3, p.w, 6);
      else { ctx.beginPath(); ctx.arc(0, 0, p.w/2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
  }
  ctx.restore();

  // 7. HUD Bar
  rrect(20, 8, 170, 34, 6); ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fill();
  ctx.strokeStyle = COL.hud; ctx.lineWidth = 1.5; ctx.stroke();
  text('BONUS', 30, 12, 1.4, COL.hud, 'l');
  text('+' + doodlePts, 30, 22, 2.4, COL.gold, 'l');

  rrect(WNAT/2 - 90, 8, 180, 34, 6); ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fill();
  ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 2; ctx.stroke();
  const altIcon = doodleAlt >= 800 ? '🚀 ' : (doodleAlt >= 400 ? '☁️ ' : '🎈 ');
  text(altIcon + doodleAlt + 'm', WNAT/2, 16, 2.6, '#00E5FF', 'c', '#000', true);

  const sec = Math.max(0, doodleTimer / 60).toFixed(1);
  const isLow = doodleTimer < 300 && doodleTimer > 0;
  const timerCol = isLow ? ((Math.floor(frame / 6) % 2 === 0) ? '#FF3333' : '#FFD700') : COL.hud;
  rrect(WNAT - 170, 8, 150, 34, 6); ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fill();
  ctx.strokeStyle = timerCol; ctx.lineWidth = 2; ctx.stroke();
  text('TIME  ' + sec + 's', WNAT - 95, 16, 2.6, timerCol, 'c', '#000', true);

  rrect(WNAT - 190, HNAT - 44, 170, 34, 6); ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fill();
  ctx.strokeStyle = (doodleCombo >= 4) ? COL.hud : COL.gold; ctx.lineWidth = 1.5; ctx.stroke();
  text(doodleCombo >= 8 ? '8x FRENZY!' : doodleCombo + 'x COMBO', WNAT - 105, HNAT - 38, 1.8, (doodleCombo >= 5) ? COL.hud : COL.gold, 'c', '#000');
  const comboRatio = Math.max(0, doodleComboTimer / 110);
  rect(WNAT - 180, HNAT - 18, 150 * comboRatio, 6, (doodleCombo >= 5) ? COL.hud : COL.gold);

  if(doodlePhase === 'finish'){
    rrect(WNAT/2 - 210, 110, 420, 180, 14); ctx.fillStyle = 'rgba(0,0,0,0.92)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = COL.gold; ctx.stroke();
    const bannerTitle = doodleMaxAlt >= 1200 ? '★ COSMIC APEX REACHED! ★' : '★ SKY HIGH COMPLETE! ★';
    text(bannerTitle, WNAT/2, 126, 3.8, COL.gold, 'c', null, true);

    text('MAX COMBO: ' + doodleMaxCombo + 'x', WNAT/2, 234, 2.4, COL.gold, 'c');

}

function drawDoodleSky(skyAlt){
  // Transitions: 350..450m (Day -> Sunset), 750..850m (Sunset -> Deep Space)
  // Alphas are driven by doodleSkyAlt which never decreases, ensuring the sky never reverts if falling!
  const sunsetAlpha = Math.max(0, Math.min(1, (skyAlt - 350) / 100));
  const spaceAlpha = Math.max(0, Math.min(1, (skyAlt - 750) / 100));

  // 1. Day Sky (Playground bright blue with white clouds)
  if(sunsetAlpha < 1){
    rect(0, 0, WNAT, HNAT, '#56CDFD');
    for(const [x,y,s] of CLOUDS){
      const py = ((y - doodleCamY * 0.15)%900 + 900)%900 - 100;
      cloud(x, py, s);
    }
  }

  // 2. Sunset / Twilight Sky (Warm purple-to-pink gradient with soft sunset clouds)
  if(sunsetAlpha > 0 && spaceAlpha < 1){
    ctx.save();
    ctx.globalAlpha = sunsetAlpha;
    const grd = ctx.createLinearGradient(0, 0, 0, HNAT);
    grd.addColorStop(0, '#5A3791');
    grd.addColorStop(1, '#FF758C');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, WNAT, HNAT);
    for(const [x,y,s] of CLOUDS){
      const py = ((y - doodleCamY * 0.1)%900 + 900)%900 - 100;
      disc(x, py, 40*s, 20*s, 'rgba(255, 230, 240, 0.45)');
      disc(x + 25*s, py - 10*s, 30*s, 24*s, 'rgba(255, 230, 240, 0.45)');
    }
    ctx.restore();
  }

  // 3. Cosmic Space Sky (Deep navy-black starfield, twinkling stars, moon, Saturn)
  if(spaceAlpha > 0){
    ctx.save();
    ctx.globalAlpha = spaceAlpha;
    ctx.fillStyle = '#0B091A'; ctx.fillRect(0, 0, WNAT, HNAT);
    for(let i = 0; i < 45; i++){
      const sx = (i * 97) % WNAT;
      const sy = ((i * 131 - doodleCamY * 0.08)%HNAT + HNAT)%HNAT;
      const twinkle = Math.sin(frame * 0.1 + i) * 0.5 + 0.5;
      disc(sx, sy, 1.5 + twinkle, 1.5 + twinkle, i%3 === 0 ? '#00E5FF' : (i%3 === 1 ? '#FFD700' : '#FFFFFF'));
    }
    const my = ((-doodleCamY * 0.05 + 100)%600 + 600)%600;
    disc(WNAT - 120, my, 32, 32, '#FFFDE7');
    disc(WNAT - 132, my - 6, 28, 28, '#0B091A');
    disc(120, ((my + 220)%HNAT), 16, 16, '#CE93D8');
    ctx.strokeStyle = '#BA68C8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(120, ((my + 220)%HNAT), 28, 6, -0.3, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawDoodlePlatform(pl){
  const py = pl.y - doodleCamY;
  const sq = pl.squash || 0;
  const x = pl.x, w = pl.w;

  if(pl.t === 'wood'){
    rrect(x, py - sq, w, 14, 4); ctx.fillStyle = '#BA7742'; ctx.fill();
    rect(x + 2, py - sq, w - 4, 3, '#D99863');
    rect(x + 2, py - sq + 11, w - 4, 3, '#7A4822');
  } else if(pl.t === 'tire'){
    rrect(x, py - sq, w, 16, 6); ctx.fillStyle = '#2E7D32'; ctx.fill();
    rect(x + 4, py - sq, w - 8, 3, '#4CAF50');
    for(let tx = x + 8; tx < x + w - 6; tx += 12) rect(tx, py - sq + 3, 3, 10, '#1B5E20');
  } else if(pl.t === 'spring'){
    rrect(x, py - sq, w, 14, 4); ctx.fillStyle = '#BA7742'; ctx.fill();
    const cx = x + w / 2;
    ctx.strokeStyle = '#FBC02D'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - 8, py - sq); ctx.lineTo(cx + 8, py - sq - 6); ctx.lineTo(cx - 8, py - sq - 12); ctx.lineTo(cx, py - sq - 18);
    ctx.stroke();
    disc(cx, py - sq - 18, 4, 4, '#FFD700');
  } else if(pl.t === 'cloud'){
    rrect(x, py - sq, w, 18, 9); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    disc(x + 16, py - sq + 2, 12, 10, '#FFFFFF');
    disc(x + w/2, py - sq - 4, 16, 12, '#FFFFFF');
    disc(x + w - 16, py - sq + 2, 12, 10, '#FFFFFF');
    rect(x + 4, py - sq + 12, w - 8, 4, '#E0F2F1');
  } else if(pl.t === 'balloon'){
    rrect(x, py - sq, w, 12, 6); ctx.fillStyle = '#FF4081'; ctx.fill();
    const cols = ['#FF4081', '#00E5FF', '#FFEA00'];
    for(let i = 0; i < 3; i++){
      const bx = x + 16 + i * (w - 32)/2;
      disc(bx, py - sq - 6, 10, 13, cols[i]);
      disc(bx - 3, py - sq - 10, 3, 4, '#FFF');
    }
  } else if(pl.t === 'cloud_spring'){
    rrect(x, py - sq, w, 18, 9); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    disc(x + w/2, py - sq - 4, 16, 12, '#FFFFFF');
    disc(x + w/2, py - sq - 12, 7, 7, '#FFD700');
    disc(x + w/2, py - sq - 12, 3, 3, '#FFF');
  } else if(pl.t === 'rainbow'){
    const rbCols = ['#FF5252', '#FFD740', '#69F0AE', '#40C4FF', '#E040FB'];
    for(let i = 0; i < rbCols.length; i++){
      rrect(x, py - sq + i * 3, w, 4, 2); ctx.fillStyle = rbCols[i]; ctx.fill();
    }
  } else if(pl.t === 'satellite'){
    const cx = x + w / 2;
    rrect(cx - 16, py - sq, 32, 14, 4); ctx.fillStyle = '#ECEFF1'; ctx.fill();
    rect(x, py - sq + 2, cx - 18 - x, 10, '#1565C0');
    rect(cx + 18, py - sq + 2, x + w - (cx + 18), 10, '#1565C0');
    disc(cx, py - sq - 4, 3, 3, '#00E5FF');
  } else if(pl.t === 'moon_rock'){
    rrect(x, py - sq, w, 16, 8); ctx.fillStyle = '#90A4AE'; ctx.fill();
    rect(x + 4, py - sq, w - 8, 3, '#CFD8DC');
    disc(x + 18, py - sq + 8, 4, 4, '#607D8B');
    disc(x + w - 22, py - sq + 9, 5, 5, '#607D8B');
  } else if(pl.t === 'star_spring'){
    rrect(x, py - sq, w, 14, 4); ctx.fillStyle = '#FF6D00'; ctx.fill();
    const cx = x + w / 2;
    disc(cx, py - sq - 8, 8, 8, '#FFD600');
    disc(cx, py - sq - 8, 4, 4, '#FFF');
  } else if(pl.t === 'ufo'){
    const cx = x + w / 2;
    disc(cx, py - sq + 6, w / 2, 8, '#00E676');
    disc(cx, py - sq, 14, 10, 'rgba(0, 229, 255, 0.7)');
    for(let lx = x + 8; lx < x + w - 6; lx += 14) disc(lx, py - sq + 8, 2, 2, '#FFEB3B');
  } else {
    rrect(x, py - sq, w, 14, 4); ctx.fillStyle = '#BA7742'; ctx.fill();
  }
}

function drawDoodleParachute(x, y){
  const py = y - 56;
  ctx.save();
  ctx.fillStyle = '#FF4081'; ctx.beginPath();
  ctx.arc(x, py, 34, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFEB3B'; ctx.beginPath();
  ctx.moveTo(x - 12, py); ctx.arc(x, py, 34, Math.PI * 1.15, Math.PI * 1.45); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#00E5FF'; ctx.beginPath();
  ctx.moveTo(x + 12, py); ctx.arc(x, py, 34, Math.PI * 1.55, Math.PI * 1.85); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x - 32, py); ctx.lineTo(x, y - 20);
  ctx.moveTo(x - 12, py); ctx.lineTo(x, y - 20);
  ctx.moveTo(x + 12, py); ctx.lineTo(x, y - 20);
  ctx.moveTo(x + 32, py); ctx.lineTo(x, y - 20);
  ctx.stroke();
  ctx.restore();
}

  ctx.drawImage(ATLAS,g.sx,g.sy,g.width,g.height,gx,gy,g.width,g.height);
  for(const p of confetti){ ctx.save(); ctx.translate(R(p.x),R(p.y)); ctx.rotate(p.r); ctx.fillStyle=p.c;
    if(p.s==='r') ctx.fillRect(-p.w/2,-3,p.w,6); else { ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill(); } ctx.restore(); }
  hudFrame(); hudPanels('VICTORY',16,score,true);
  if(stateT>30 && Math.floor(frame/30)%2===0) text('PRESS A',WNAT/2,118,3,'#FFFFFF','c','#000');
}
function renderVictory(){      // replicates the concept's VICTORY / HIGH SCORE frame
  neonGrid(); hudFrame();
  const bob=R(Math.sin(frame*0.08)*4);
  const tb=SPR.trophy_big;
  ctx.drawImage(ATLAS,tb.sx,tb.sy,tb.width,tb.height,R(240-tb.width/2),R(300-tb.height)+bob,tb.width,tb.height);
  text('VICTORY!',490,120,6,'#FFFFFF','c',null,true);
  if(newHigh){ text('HIGH',490,180,11,COL.hud,'c',null,true); text('SCORE!!!',490,268,6,'#FFFFFF','c',null,true); }
  else { text('SCORE',490,186,4,COL.hud,'c',null,true); text(String(score).padStart(9,'0'),490,226,4,'#FFFFFF','c');
         text('BEST '+String(highScore).padStart(9,'0'),490,270,2,COL.gold,'c'); }
  for(const p of confetti){ ctx.fillStyle=p.c; ctx.fillRect(R(p.x),R(p.y),4,4); }
}
function render(){
  ctx.imageSmoothingEnabled=false;
  if(state==='splash'){ renderSplash(); return; }
  if(state==='title'){ renderTitle(); return; }
  if(state==='win'){ renderWin(); return; }
  if(state==='victory'){ renderVictory(); return; }
  if(state==='bonus'){ renderBonus(); return; }
  if(state==='doodle'){ renderDoodle(); return; }
  if(state==='paused'){
    if(prePauseState==='bonus') renderBonus();
    else if(prePauseState==='doodle') renderDoodle();
    else renderPlay();
    overlayBox('PAUSED',['RESUME','MAIN MENU'],pauseSel);
    return;
  }
  renderPlay();
  if(state==='gameover'){ overlayBox('GAME OVER'); if(stateT>30) text('A  TRY AGAIN',WNAT/2,220,3,COL.hud,'c'); }
}

// ================= fixed-timestep loop (Ring Chase) =================
const STEP=1000/60;
let accT=0, lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  if(now===undefined) now=performance.now();
  let dt=now-lastT; lastT=now;
  if(dt>250) dt=STEP;
  accT+=dt;
  if(accT>STEP*3) accT=STEP*3;
  const pads=pollPads();
  lastPads=pads; lastPadCount=pads.length;
  padEdges(pads);
  pollSources(); frameInput();
  let ticks=0;
  while(accT>=STEP && ticks<5){ tick(); accT-=STEP; ticks++; }
  if(ticks===5) accT=0;
  render();
  if(crtOn) drawCRT();
}
// ================= boot =================
try{ const d=parseInt(localStorage.getItem('ms_diff')); if(d>=0&&d<DIFFS.length) diffSel=d; }catch(e){}
loadButtonMap();
try{ if(localStorage.getItem('ms_crt')==='1') applyCRT(true); }catch(e){}
buildLevel(1); spawnPlayers([{id:'cyan',src:'kb'}],80); resetBoss();
applyLayout();
if(soundPref()==='on'){ initAudio(); actx.resume().catch(()=>{}); setTrack('street'); }
loop();

</script>
