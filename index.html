<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mouse Squad</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mouse Squad">
<meta name="theme-color" content="#000000">
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
            touch-action:none;-webkit-user-select:none;user-select:none;}
  body{display:flex;flex-direction:column;}
  #wrap{display:flex;align-items:center;justify-content:center;flex:1 1 auto;min-height:0;}
  body.touch #wrap{padding-top:env(safe-area-inset-top, 0px);box-sizing:border-box;
       align-items:flex-start;}
  #cv{image-rendering:pixelated;image-rendering:crisp-edges;}
  #glcv{position:fixed;display:none;pointer-events:none;z-index:5;image-rendering:auto;}
  #ui{display:none;position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#e8d8b0;
      font-family:monospace;font-size:13px;text-align:center;opacity:.85;pointer-events:none;
      text-shadow:1px 1px 0 #000;white-space:nowrap;max-width:96vw;overflow:hidden;}
  /* ---- touch controls: fixed-height bar at the bottom (portrait phones) ---- */
  #pad{display:none;position:relative;flex:0 0 auto;
       height:calc(var(--u)*3 + 28px + env(safe-area-inset-bottom, 0px));
       background:#000000;border-top:3px solid #2c2118;box-sizing:border-box;
       padding-bottom:env(safe-area-inset-bottom, 0px);}
  body.touch #pad{display:block;}
  body.touch #ui{display:none;}
  /* left: traditional d-pad (whole zone touchable, slide between arms) */
  #pad{--u:clamp(40px, 14.5vw, 64px);        /* d-pad arm size */
       --ab:clamp(58px, 18.5vw, 92px);}      /* action button size */
  #stickzone{position:absolute;left:0;top:0;width:52%;height:calc(100% - env(safe-area-inset-bottom, 0px));}
  #dpad{position:absolute;left:50%;top:14px;transform:translateX(-50%);
        width:calc(var(--u)*3);height:calc(var(--u)*3);}
  .darm{position:absolute;width:var(--u);height:var(--u);background:#12201a;
        display:flex;align-items:center;justify-content:center;color:#3FFC03;
        box-shadow:0 3px 0 #0a0705, inset 0 1px 0 rgba(255,235,200,.07);}
  .darm svg{width:55%;height:55%;}
  .darm.on{background:#1d3a24;color:#e8ffe0;transform:translateY(2px);box-shadow:0 1px 0 #0a0705;}
  #d-up{left:var(--u);top:0;border-radius:10px 10px 0 0;}
  #d-down{left:var(--u);top:calc(var(--u)*2);border-radius:0 0 10px 10px;}
  #d-left{left:0;top:var(--u);border-radius:10px 0 0 10px;}
  #d-right{left:calc(var(--u)*2);top:var(--u);border-radius:0 10px 10px 0;}
  #d-mid{left:var(--u);top:var(--u);box-shadow:none;border-radius:0;background:#12201a;}
  #d-mid::after{content:'';position:absolute;left:33%;top:33%;width:34%;height:34%;
        border-radius:50%;background:#1c1610;}
  /* right: action buttons */
  #btnzone{position:absolute;right:0;top:0;width:48%;height:calc(100% - env(safe-area-inset-bottom, 0px));}
  #btns{position:absolute;right:clamp(8px,4vw,26px);top:calc(14px + var(--u)*1.5);
        transform:translateY(-50%) rotate(-18deg);
        width:calc(var(--ab)*2.3);height:calc(var(--ab)*1.25);}
  .ab{position:absolute;width:var(--ab);height:var(--ab);border-radius:50%;
      background:#E133CF;color:#fff;font-family:monospace;font-weight:bold;
      font-size:calc(var(--ab)*0.35);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 0 #6a0f60, inset 0 -4px 8px rgba(0,0,0,.25);}
  .ab.on{transform:translateY(3px);box-shadow:0 1px 0 #6a0f60, inset 0 -2px 6px rgba(0,0,0,.3);}
  #btnB{left:0;top:calc(var(--ab)*0.28);}
  #btnA{left:calc(var(--ab)*1.3);top:0;}
  #pausebtn{position:absolute;right:clamp(8px,4vw,26px);bottom:2px;
        display:flex;align-items:center;gap:7px;
        padding:8px clamp(12px,4vw,22px);border-radius:14px;background:#0d1a10;color:#3FFC03;
        font-family:monospace;font-size:12px;letter-spacing:2px;box-shadow:0 3px 0 #0a0705;}
  #pausebtn svg{width:15px;height:15px;}
  #pausebtn.on{transform:translateY(2px);box-shadow:0 1px 0 #0a0705;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<canvas id="glcv"></canvas>
<div id="pad">
  <div id="stickzone">
    <div id="dpad">
      <div class="darm" id="d-up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6 -6l6 6"/></svg></div>
      <div class="darm" id="d-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></div>
      <div class="darm" id="d-mid"></div>
      <div class="darm" id="d-right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"/></svg></div>
      <div class="darm" id="d-down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></svg></div>
    </div>
  </div>
  <div id="btnzone">
    <div id="btns">
      <div class="ab" id="btnB">B</div>
      <div class="ab" id="btnA">A</div>
    </div>
    <div id="pausebtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>PAUSE</div>
  </div>
</div>

// ================= CRT post-process (WebGL, single pass, Pi-friendly) =================
let crtOn=false, crtGL=null, crtFailed=false;
const CRT_VERT = `
attribute vec2 aPos;
varying vec2 vUV;
void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;
const CRT_FRAG = `
precision highp float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uSrc;   // source (game) resolution
uniform vec2 uOut;   // output resolution
// gentle barrel curvature (tube bulge)
vec2 curve(vec2 uv){
  uv = uv*2.0-1.0;
  vec2 off = abs(uv.yx)/vec2(7.0, 5.5);
  uv += uv*off*off;
  return uv*0.5+0.5;
}
float gaus(float x, float s){ return exp(-(x*x)/(2.0*s*s)); }
// one phosphor scanline: horizontal gaussian in SOURCE pixels (CRTs are
// continuous horizontally — detail survives; only vertical is quantized)
vec3 lineSample(float ux, float yc, float sig, float stride){
  vec3 acc=vec3(0.0); float wt=0.0;
  for(int i=-2;i<=2;i++){
    float ox=float(i)*stride;
    float w=gaus(ox,sig);
    acc+=texture2D(uTex, vec2(ux+ox/uSrc.x, yc)).rgb*w; wt+=w;
  }
  return acc/wt;
}
void main(){
  vec2 uv = curve(vUV);
  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0){ gl_FragColor=vec4(0.0,0.0,0.0,1.0); return; }
  // scanlines every 2 source px (matches the art's pixel size; eyes stay on a line)
  float Vy = uSrc.y/2.0;
  float py = uv.y*Vy - 0.5;
  float y0 = floor(py), fy = py - y0;
  float ycA=(y0+0.5)/Vy, ycB=(y0+1.5)/Vy;
  // pixel body: crisp horizontal with a soft beam-spot blur (sigma < 1 source px)
  vec3 cA = lineSample(uv.x, ycA, 0.55, 1.0);
  vec3 cB = lineSample(uv.x, ycB, 0.55, 1.0);
  // beam width grows with brightness -> bright pixels halo (Lottes trick)
  float lA = dot(cA,vec3(0.30,0.55,0.15));
  float lB = dot(cB,vec3(0.30,0.55,0.15));
  float wA = gaus(fy,     0.30+0.20*lA);
  float wB = gaus(1.0-fy, 0.30+0.20*lB);
  vec3 col = cA*wA + cB*wB;
  // crisp detail layer: pull small dark features (eyes!) back through the glow
  vec3 sharp = texture2D(uTex, uv).rgb;
  col = mix(col, sharp*max(wA,wB), 0.42);
  // soft wide bloom, gated by local darkness: gentle ambient phosphor glow
  // without washing out colors or bleaching highlights to white
  float dark = smoothstep(0.02, 0.30, dot(sharp,vec3(0.30,0.55,0.15)));
  vec3 gA = lineSample(uv.x, ycA, 2.2, 2.0);
  vec3 gB = lineSample(uv.x, ycB, 2.2, 2.0);
  col += (gA*gaus(fy,0.60) + gB*gaus(1.0-fy,0.60)) * 0.05 * (0.30+0.70*dark);
  // subtle aperture grille (keeps vibrance, still reads as phosphor stripes)
  float ph = mod(vUV.x*uOut.x, 3.0);
  vec3 mask = vec3(0.90);
  if(ph<1.0) mask.r=1.0; else if(ph<2.0) mask.g=1.0; else mask.b=1.0;
  col *= mask;
  // balanced brightness & saturation: preserves true colors without whiteout clipping
  col *= 1.04;
  float lum = dot(col,vec3(0.30,0.55,0.15));
  col = mix(vec3(lum), col, 1.06);
  // vignette / tube edge falloff (kept)
  vec2 vg = vUV*(1.0-vUV.yx);
  float vig = pow(clamp(vg.x*vg.y*32.0,0.0,1.0), 0.22);
  col *= vig;
  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);
}`;
function crtCompile(gl, type, src){
  const sh=gl.createShader(type); gl.shaderSource(sh,src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){ console.warn('CRT shader:',gl.getShaderInfoLog(sh)); return null; }
  return sh;
}
function initCRT(){
  if(crtGL||crtFailed) return;
  const g=document.getElementById('glcv');
  const gl=g.getContext('webgl',{antialias:false,preserveDrawingBuffer:false,alpha:false});
  if(!gl){ crtFailed=true; return; }
  const vs=crtCompile(gl,gl.VERTEX_SHADER,CRT_VERT), fs=crtCompile(gl,gl.FRAGMENT_SHADER,CRT_FRAG);
  if(!vs||!fs){ crtFailed=true; return; }
  const prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ crtFailed=true; return; }
  gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
  const aPos=gl.getAttribLocation(prog,'aPos'); gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  crtGL={canvas:g, gl, prog, tex,
    uSrc:gl.getUniformLocation(prog,'uSrc'),
    uOut:gl.getUniformLocation(prog,'uOut'),
    uTex:gl.getUniformLocation(prog,'uTex')};
  gl.uniform1i(crtGL.uTex,0);
}
function drawCRT(){
  if(crtFailed) { crtOn=false; document.getElementById('glcv').style.display='none'; return; }
  if(!crtGL) initCRT();
  if(!crtGL) return;
  const g=crtGL.canvas, gl=crtGL.gl;
  // overlay exactly on top of the game canvas (cached to eliminate layout thrashing)
  if(crtDirty || !crtRect){
    crtRect=cv.getBoundingClientRect();
    const dpr=Math.min(window.devicePixelRatio||1, 2);
    crtOw=Math.max(1,Math.round(crtRect.width*dpr));
    crtOh=Math.max(1,Math.round(crtRect.height*dpr));
    g.style.left=crtRect.left+'px'; g.style.top=crtRect.top+'px';
    g.style.width=crtRect.width+'px'; g.style.height=crtRect.height+'px';
    if(g.width!==crtOw||g.height!==crtOh){ g.width=crtOw; g.height=crtOh; }
    crtDirty=false;
  }
  gl.viewport(0,0,crtOw,crtOh);
  gl.bindTexture(gl.TEXTURE_2D,crtGL.tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  gl.uniform2f(crtGL.uSrc,WNAT,HNAT);
  gl.uniform2f(crtGL.uOut,crtOw,crtOh);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function applyCRT(on){
  crtOn=!!on;
  const g=document.getElementById('glcv');
  if(crtOn && !crtFailed){ g.style.display='block'; cv.style.opacity='0.001'; }
  else { g.style.display='none'; cv.style.opacity='1'; }
}

// ---------- sprite decoding: palette + run-length base64 (255 = transparent) ----------
function decodeSprite(a){
  const c=document.createElement('canvas'); c.width=a.w; c.height=a.h;
  const g=c.getContext('2d'), img=g.createImageData(a.w,a.h);
  const bin=atob(a.r); let p=0;
  for(let k=0;k<bin.length;k+=2){
    const v=bin.charCodeAt(k), n=bin.charCodeAt(k+1);
    for(let t=0;t<n;t++,p++){
      if(v===255) continue;
      const col=a.pal[v]; img.data[p*4]=col[0]; img.data[p*4+1]=col[1]; img.data[p*4+2]=col[2]; img.data[p*4+3]=255;
    }
  }
  g.putImageData(img,0,0); return c;
}
function flipped(c){

(()=>{

  for(const k in ASSETS){ if(k[0]==='_') continue; rawCanvases[k] = decodeSprite(ASSETS[k]); }
  rawCanvases.trophy_grey = tinted(rawCanvases.trophy, '#757575');

  const flippedCanvases = {};
  for(const k in rawCanvases){
    if(k === 'win_group') continue; // win_group is 528x241 celebration art, never drawn flipped
    flippedCanvases[k] = flipped(rawCanvases[k]);
  }

  const packList = [];
  for(const k in rawCanvases){
    packList.push({ target: SPR, key: k, src: rawCanvases[k], w: rawCanvases[k].width, h: rawCanvases[k].height });
  }
  for(const k in flippedCanvases){
    packList.push({ target: SPRL, key: k, src: flippedCanvases[k], w: flippedCanvases[k].width, h: flippedCanvases[k].height });
  }

  // Shelf pack with 2px padding into 1024 width (sorted by height descending)
  packList.sort((a,b)=>(b.h - a.h) || (b.w - a.w));
  let cx = 0, cy = 0, rowH = 0;
  for(const item of packList){
    if(cx + item.w + 2 > 1024){
      cx = 0;
      cy += rowH;
      rowH = 0;
    }
    item.sx = cx;
    item.sy = cy;
    cx += item.w + 2;
    if(item.h + 2 > rowH) rowH = item.h + 2;
  }
  ATLAS.width = 1024;
  ATLAS.height = cy + rowH;
  const ag = ATLAS.getContext('2d');
  for(const item of packList){

  for(const k in SPR){

  }
})();

function text(s,x,y,px,col,align='l',shadow=null,bold=false){

    ctx.fillStyle=c;
    const cy=y+dy;

    for(let i=0; i<s.length; i++){
      const ch=s[i];

        const sp=F5_SPANS[ch]||F5_SPANS[' '];

  pass(0,0,col);
}

// ================= players: one mouse each (up to 3) =================
const GH=0.42, GL=0.95, TERM=12, ACC=0.28, FR=0.80;
const HIT_H={pink:80, cyan:98, yellow:80};          // hitbox heights match each sprite
const PCOL=['#3FFC03','#FC3BA0','#03F9FC'];         // P1 / P2 / P3 tag colours
function newBody(id,x,y){ return {id,x,y,vx:0,vy:0,face:1,ground:true,coyote:0,buf:0,dbl:false,jheld:false,walk:0,inv:0,launch:0}; }
let players=[], koFx=[];
// players: [{id, src, b, lives, out}]
function spawnPlayers(picks, x){            // picks: [{id, src}]
  players=picks.map((p,k)=>({id:p.id, src:p.src, b:newBody(p.id, x+k*96, FEET), lives:3, out:false, jq:false, upPressed:false, prevUp:false}));
  koFx=[];
}
const _alivePlayersList=[];
function alivePlayers(){
  _alivePlayersList.length=0;
  for(let i=0; i<players.length; i++){
    if(!players[i].out) _alivePlayersList.push(players[i]);
  }
  return _alivePlayersList;
}
function nearestPlayer(x){ let best=null,d=1e9; for(const p of alivePlayers()){ const dd=Math.abs(p.b.x-x); if(dd<d){d=dd;best=p;} } return best; }
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function bodyBox(b){ const h=HIT_H[b.id]||86; return {x:b.x-17, y:b.y-h, w:34, h}; }
let leftWall=0, rightWall=LEVEL_LEN;
function moveBody(b, dx, jumpEdge, dy = 0){
  const st=MOUSE_STATS[b.id];
  const h=HIT_H[b.id]||86;
  if(dx){ b.vx+=dx*ACC*(Math.sign(b.vx)!==dx&&b.vx!==0?1.8:1); b.face=dx; }
  else b.vx*=b.ground?FR:0.97;            // keep momentum in the air
  const lim=b.launch>0?6.5:st.maxv;            // a stomp launch is allowed past the run speed
  if(b.launch>0){ b.launch--; if(!dx) b.vx/=b.ground?FR:0.97; }   // no drag while launched
  b.vx=Math.max(-lim,Math.min(lim,b.vx)); if(Math.abs(b.vx)<0.05) b.vx=0;
  // jump: buffered + coyote time, yellow gets one air jump
  if(jumpEdge) b.buf=7;
  if(b.buf>0){
    if(b.ground||b.coyote>0){ b.vy=-st.jv; b.ground=false; b.coyote=0; b.buf=0; sfx('jump'); }
    else if(st.dbl && !b.dbl && jumpEdge){ b.vy=-st.jv*0.88; b.dbl=true; b.buf=0; sfx('jump2'); }
  }
  if(b.buf>0) b.buf--;
  b.vy+=(b.jheld&&b.vy<0)?GH:GL; if(b.vy>TERM) b.vy=TERM;
  b.x+=b.vx;
  b.x=Math.max(leftWall+20,Math.min(rightWall-20,b.x));
  let box=bodyBox(b);
  for(const c of crates){
    if(currentLevel===1 && c.zone && c.zone!==l1Zone) continue;
    if(overlap(box,c)){
      if(c.t==='computer' || c.t==='modem_exit' || c.t==='port_in' || c.t==='firewall' || c.t==='keyspring' || c.t==='spring_rider' || c.t==='mega_trampoline' || c.t==='seesaw' || c.t==='slide' || c.t==='ram' || c.t==='pcb' || c.t==='ruler' || c.t==='monkey_bars') continue;
      if(b.y <= c.y + 2) continue;
      if(b.vx>0) b.x=c.x-17; else if(b.vx<0) b.x=c.x+c.w+17;
      b.vx=0; box=bodyBox(b);
    }
  }
  const wasGround=b.ground; b.ground=false;
  b.y+=b.vy; box=bodyBox(b);
  if(b.y>=FEET){ b.y=FEET; b.vy=0; b.ground=true; }
  for(const c of crates){
    if(currentLevel===1 && c.zone && c.zone!==l1Zone) continue;
    if(overlap(box,c)){
      if(c.t==='computer' || c.t==='modem_exit' || c.t==='port_in') continue;
      if(c.t==='keyspring'){
        if(b.vy>=0 && (b.y-b.vy<=c.y+14) && b.y>=c.y-4 && b.y<=c.y+28){
          c.squash = 12;
          b.y = c.y;
          b.vy = -16.5;
          b.ground = false;
          sfx('spring');
          fx.push({t:'spark', x: c.x+c.w/2, y: c.y, age:0});
        }
        continue;
      } else if(c.t==='spring_rider'){
        if(b.vy>=0 && (b.y-b.vy<=c.y+14) && b.y>=c.y-4 && b.y<=c.y+28){
          c.squash = 10;
          b.y = c.y;
          b.vy = -13.5;
          b.ground = false;
          sfx('spring');
          fx.push({t:'spark', x: c.x+c.w/2, y: c.y, age:0});
        }
        continue;
      } else if(c.t==='mega_trampoline'){
        if(b.vy>=0 && (b.y-b.vy<=c.y+14) && b.y>=c.y-4 && b.y<=c.y+32){
          c.squash = 20;
          b.y = c.y;
          b.vy = -26.0;
          b.ground = false;
          sfx('spring_super');
          shake = 6;
          fx.push({t:'star', x: c.x+c.w/2, y: c.y, age:0, small: false});
          if(!doodleTrampolineUsed && state === 'play' && (!trampLaunch || !trampLaunch.active)){
            const p = players.find(q=>q.b===b);
            trampLaunch = { active: true, player: p, crate: c };
            fx.push({t:'pts', x: c.x+c.w/2, y: c.y - 32, txt: 'MEGA LAUNCH! 🚀', age: 0, big: true, col: COL.hud});
          }
        }
        continue;
      } else if(c.t==='seesaw'){
        const cx = c.x + c.w / 2, cy = c.y + 12;
        if(b.x >= c.x - 4 && b.x <= c.x + c.w + 4){
          const plankY = cy + Math.sin(c.angle || 0) * (b.x - cx) - 6;
          if(b.vy >= 0 && (b.y - b.vy <= plankY + 14) && (b.y >= plankY - 8)){
            b.y = plankY;
            b.vy = 0;
            b.ground = true;
          }
        }
        continue;
      } else if(c.t==='slide'){
        const ladderStart = c.x - 12, ladderEnd = c.x + 28;
        const deckStart = c.x + 16, deckEnd = c.x + 52;
        const chuteStart = c.x + 48, chuteEnd = c.x + c.w;

        // 1. Climbable Ladder Rungs
        if(b.x >= ladderStart && b.x <= ladderEnd && b.y <= FEET + 2 && b.y >= c.y - 4){
          if(dy < 0){
            b.vy = -3.8;
            b.ground = true;
          } else if(dy > 0 && b.y < FEET){
            b.vy = 3.8;
            b.ground = true;
          } else if(b.y < FEET - 4 && b.vy > 0 && !jumpEdge){
            b.vy = Math.min(b.vy, 1.2);
          }
          if(b.y <= c.y + 4 && b.vy <= 0){
            b.y = c.y;
            b.vy = 0;
            b.ground = true;
          }
        }

        // 2. Tower Deck Platform
        if(b.x >= deckStart && b.x <= deckEnd){
          if(b.vy >= 0 && (b.y - b.vy <= c.y + 14) && (b.y >= c.y - 8)){
            b.y = c.y;
            b.vy = 0;
            b.ground = true;
          }
        }

        // 3. Sliding Chute Slope Physics
        if(b.x >= chuteStart && b.x <= chuteEnd){
          const t = Math.min(1, Math.max(0, (b.x - chuteStart) / (chuteEnd - chuteStart)));
          const slopeY = (c.y + 6) + (FEET - 4 - (c.y + 6)) * (0.35 * t + 0.65 * t * t);
          if((b.vy >= 0 && b.y >= slopeY - 12 && b.y <= slopeY + 28) || (b.y >= slopeY - 6 && b.y <= slopeY + 12)){
            b.y = slopeY;
            b.ground = true;
            b.vx = Math.max(5.8, b.vx + 0.65);
            b.face = 1;
            if(t < 0.92 && frame % 4 === 0){
              fx.push({t:'spark', x: b.x, y: b.y, age: 0});
            }
            if(t >= 0.94){
              b.vx = Math.max(b.vx, 7.5);
              b.vy = -2.2;
              b.ground = false;
              sfx('jump');
            }
          }
        }
        continue;
      } else if(c.t==='firewall'){
        const p = players.find(q=>q.b===b);
        if(p) hurtPlayer(p);
        continue;
      }
      if(c.t==='ram' || c.t==='pcb' || c.t==='ruler' || c.t==='monkey_bars'){
        // Semi-solid / jump-through platform: land smoothly when falling from above
        if(b.vy >= 0 && (b.y - b.vy <= c.y + 14) && (b.y >= c.y - 4)){
          b.y = c.y;
          b.vy = 0;
          b.ground = true;
        }
        continue;
      }
      if(b.vy>=0 && b.y-b.vy<=c.y+14){ b.y=c.y; b.vy=0; b.ground=true; }
      else if(b.vy<0){
        // Corner slip / ledge nudge: prevent harsh head bonks on near-miss corners
        const leftOverlap = (b.x + 12) - c.x;
        const rightOverlap = (c.x + c.w) - (b.x - 12);
        if(leftOverlap > 0 && leftOverlap <= 8 && b.vx <= 0){
          b.x = c.x - 17;
        } else if(rightOverlap > 0 && rightOverlap <= 8 && b.vx >= 0){
          b.x = c.x + c.w + 17;
        } else {
          b.y = c.y + c.h + h;
          b.vy = 0;
        }
      }
      box=bodyBox(b);
    }
  }
  if(b.ground){ b.dbl=false; b.coyote=8; } else if(wasGround&&b.vy>=0) b.coyote=8; else if(b.coyote>0) b.coyote--;
  if(b.ground && Math.abs(b.vx)>0.2) b.walk+=Math.abs(b.vx); else if(b.ground) b.walk=0;
  if(b.inv>0) b.inv--;
}

function enemyBox(e){
  if(e.t==='plane') return {x:e.x-20, y:e.y-12, w:40, h:20};
  if(e.t==='frisbee') return {x:e.x-22, y:e.y-10, w:44, h:18};
  if(e.t==='byte_wasp') return {x:e.x-16, y:e.y-12, w:32, h:24};
  if(e.t==='bug') return {x:e.x-15, y:e.y-18, w:30, h:18};
  if(e.t==='spark') return {x:e.x-12, y:e.y-24, w:24, h:24};
  if(e.t==='dodgeball') return {x:e.x-16, y:e.y-30, w:32, h:30};
  if(e.t==='toy_frog') return {x:e.x-14, y:e.y-20, w:28, h:20};

function stepEnemies(){
  const D=curDiff();
  for(const e of enemies){
    if(currentLevel===1 && e.zone && e.zone!==l1Zone) continue;
    if(!e.alive){ if(e.dead>0) e.dead--; continue; }
    const tgt=nearestPlayer(e.x); if(!tgt || Math.abs(e.x-tgt.b.x)>900) continue;   // asleep off-screen
    if(e.t==='plane' || e.t==='byte_wasp' || e.t==='frisbee'){
      const prevY=e.y;
      e.x+=e.vx*D.enemy;
      e.y=e.baseY+Math.sin(frame*0.08+e.x*0.02)*8;
      e.vy=e.y-prevY;
      if(e.x<e.minX||e.x>e.maxX) e.vx*=-1;
    } else if(e.t==='eraser' || e.t==='bug'){
      e.vy=0;
      e.x+=e.vx*D.enemy; if(e.x<e.minX||e.x>e.maxX) e.vx*=-1;
    } else if(e.t==='dodgeball'){
      e.vy=(e.vy||0)+0.45; e.y+=e.vy; if(e.y>=FEET){ e.y=FEET; e.vy=-6.5; }
      e.x+=e.vx*D.enemy; if(e.x<e.minX||e.x>e.maxX) e.vx*=-1;
    } else {
      e.vy=(e.vy||0)+0.45; e.y+=e.vy; if(e.y>=FEET){ e.y=FEET; e.vy=0; }
      if(e.y>=FEET && --e.hop<=0){ e.vy=-8.5; e.hop=70+Math.random()*50; e.dir=Math.sign(tgt.b.x-e.x)||1; }
      if(e.y<FEET) e.x+=(e.dir||-1)*1.4*D.enemy;
    }
  }
}

const boss={x:0,y:0,vx:0,vy:0,state:'wait',t:0,hp:5,maxhp:5,face:-1,inv:0,squash:1};

function bossAI(){
  const D=curDiff();
  if(boss.inv>0) boss.inv--;
  const tgt=nearestPlayer(boss.x); const tx0=tgt?tgt.b.x:boss.x;
  const toward=Math.sign(tx0-boss.x)||boss.face;
  const minX=ARENA_X+218, maxX=ARENA_X+WNAT-218;     // stops at the crate stacks: they're a safe perch
  switch(boss.state){
    case 'wait': return;
    case 'enter':                                       // propeller descent + roar
      boss.y+=2.2; boss.squash=1;
      if(boss.y>=FEET){ boss.y=FEET; boss.state='roar'; boss.t=60; shake=18; sfx('slam'); setTrack('boss'); }
      return;
    case 'roar': if(--boss.t<=0){ boss.state='walk'; boss.t=90; } return;
    case 'walk':
      boss.face=toward;
      boss.vx=boss.face*D.spd*(1+(boss.maxhp-boss.hp)*0.08);
      boss.x+=boss.vx;
      if(--boss.t<=0){
        if(D.throws && Math.random()<0.4){ boss.state='throw'; boss.t=34; }
        else { boss.state='hop'; boss.vy=-9.5; boss.vx=toward*2.2*D.spd; sfx('hop'); }
      }
      break;
    case 'hop':
      boss.vy+=0.38; boss.y+=boss.vy; boss.x+=boss.vx;
      if(boss.y>=FEET){ boss.y=FEET; boss.vy=0; boss.state='stun'; boss.t=D.stun; shake=14; sfx('slam'); }
      break;
    case 'stun':                                        // squats down: the stomp window
      boss.squash+= (0.78-boss.squash)*0.25;
      if(--boss.t<=0){ boss.state='walk'; boss.t=70+Math.random()*60; }
      break;
    case 'throw':
      boss.face=toward;
      if(--boss.t===10){
        for(let k=0;k<(boss.hp<=2?3:2);k++){
          const tx=tx0+(k-0.5)*70, dx=tx-boss.x, T=48+k*6;
          shots.push({x:boss.x+boss.face*60,y:boss.y-150,vx:dx/T,vy:-8,rot:0});
        }
        sfx('throw');
      }
      if(boss.t<=0){ boss.state='walk'; boss.t=80; }
      break;
    case 'hurt':
      boss.x+=boss.vx; boss.vx*=0.9; boss.squash+=(1-boss.squash)*0.2;
      if(--boss.t<=0){ boss.state=boss.hp<=0?'defeat':'walk'; boss.t=boss.hp<=0?110:60; if(boss.hp<=0){ setTrack(null); sfx('defeat'); } }
      break;
    case 'defeat':                                      // sad face, shake, fly away
      boss.squash+=(1-boss.squash)*0.2;
      if(boss.t>0){ boss.t--; if(boss.t%12===0) fx.push({t:'spark',x:boss.x+(Math.random()-0.5)*200,y:boss.y-100-Math.random()*120,age:0}); }
      else { boss.y-=3; boss.x+=Math.sin(frame*0.15)*1.5; if(boss.y<-260){ boss.state='gone'; onBossGone(); } }
      return;
    case 'gone': return;
  }
  if(boss.state!=='hurt' && boss.state!=='stun') boss.squash+=(1-boss.squash)*0.2;
  boss.x=Math.max(minX,Math.min(maxX,boss.x));
}
function bossHit(px){
  boss.hp--; boss.state='hurt'; boss.t=55; boss.inv=120; boss.vx=-Math.sign(px-boss.x||1)*5;   // knocked back, harmless while recovering
  shake=10; addScore(500,boss.x,bossTop()); sfx('bosshit');
  fx.push({t:'star',x:boss.x,y:boss.y-120,age:0});
  for(let k=0;k<5;k++) fx.push({t:'spark',x:boss.x+(Math.random()-0.5)*160,y:bossTop()+Math.random()*60,age:-k*3});
}
function bossCollide(){
  if(!['walk','hop','stun','throw','roar','hurt'].includes(boss.state)) return;
  const top=bossTop();
  for(const p of alivePlayers()){
    const b=p.b;
    // stomp on the propeller beanie / head (regardless of movement)
    const prevFeet = b.y - b.vy;
    const prevTop = top - (boss.vy || 0);
    const hitTop = Math.abs(b.x-boss.x)<92 && (
      (b.y>=top-14 && b.y<=top+55) ||
      (prevFeet<=prevTop+40) ||
      ((boss.vy && boss.vy<0) && b.y<=top+70)
    );
    if(hitTop && boss.inv===0){
      bossHit(b.x); b.vy=-12; b.y=top-8; b.ground=false;
      const away=Math.sign(b.x-boss.x)||-boss.face; b.vx=away*6.5; b.launch=42; b.face=away; b.inv=Math.max(b.inv,100);   // launched clear toward a side
      continue;
    }
    if(b.inv===0 && boss.inv===0 && boss.state!=='hurt' && overlap(bodyBox(b),bossBody())) hurtPlayer(p);
  }
}

// bars written as [dur-in-eighths, note] ('-' = rest); converted to [start,dur,note]
function seq(bars){
  const out=[]; let t=0;
  for(const bar of bars) for(const [d,n] of bar){ if(n!=='-') out.push([t,d,n]); t+=d; }
  return out;
}
function bassLine(chords,oct){        // root / fifth bounce, one chord per bar
  const out=[];
  chords.forEach((c,i)=>{ const [r,f]=c; [r,f,r,f].forEach((n,k)=>out.push([i*8+k*2,2,n])); });
  return out;
}
function stabs(chords){               // off-beat chord stabs on the 50% pulse
  const out=[];
  chords.forEach((c,i)=>{ for(let k=0;k<4;k++) out.push([i*8+k*2+1,1,c[2]]); });
  return out;
}

const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function freq(n){
  const m=n.match(/^([A-G])(b|#)?(\d)$/);
  const s=SEMI[m[1]]+(m[2]==='b'?-1:m[2]==='#'?1:0);
  return 440*Math.pow(2,((+m[3]+1)*12+s-69)/12);
}
let actx=null, music=null;
function pulseWave(c,duty){
  const N=32, real=new Float32Array(N), imag=new Float32Array(N);
  for(let n=1;n<N;n++) imag[n]=(2/(n*Math.PI))*Math.sin(n*Math.PI*duty);
  return c.createPeriodicWave(real,imag,{disableNormalization:false});
}
function initAudio(){
  if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  const master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination);
  music={master, muted:false, track:null, ptr:[0,0,0], loopStart:actx.currentTime+0.1,
         w25:pulseWave(actx,0.25), w50:pulseWave(actx,0.5), w125:pulseWave(actx,0.125)};
  setInterval(schedule,60);
}
function setTrack(name){
  if(!music){ pendingTrack=name; return; }
  music.track=name?TRACKS[name]:null; music.ptr=[0,0,0]; music.loopStart=actx.currentTime+0.12;
}
let pendingTrack='street';
function tone(when,dur,f,vol,wave,slideTo){
  const o=actx.createOscillator(), g=actx.createGain();
  if(typeof wave==='string') o.type=wave; else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(f,when);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,when+dur);
  g.gain.setValueAtTime(vol,when);
  g.gain.setValueAtTime(vol,Math.max(when,when+dur-0.03));
  g.gain.linearRampToValueAtTime(0.0001,when+dur);
  o.connect(g); g.connect(music.master); o.start(when); o.stop(when+dur+0.02);
}
function schedule(){
  if(!music||music.muted||!music.track) return;
  if(state==='paused') return;
  const tr=music.track, ahead=actx.currentTime+0.18;
  const chans=[[tr.mel,music.w25,0.13],[tr.hrm,music.w50,0.06],[tr.bas,'triangle',0.2]];
  for(let c=0;c<3;c++){
    const [ev,wave,vol]=chans[c]; if(!ev.length) continue;
    let guard=64;
    while(guard-->0){
      const i=music.ptr[c]%ev.length, lap=Math.floor(music.ptr[c]/ev.length);
      const t=music.loopStart+(ev[i][0]+lap*tr.len)*tr.eighth;
      if(t>ahead) break;
      if(t>actx.currentTime-0.05) tone(Math.max(t,actx.currentTime+0.01),ev[i][1]*tr.eighth*0.9,freq(ev[i][2]),vol,wave);
      music.ptr[c]++;
    }
  }
}

function sfx(name){
  if(!actx||!music||music.muted) return;

    case 'jump':   tone(t,0.12,330,0.10,W.w25,660); break;
    case 'jump2':  tone(t,0.12,500,0.10,W.w25,1000); break;
    case 'cheese': tone(t,0.06,1319,0.09,W.w25); tone(t+0.06,0.1,1760,0.09,W.w25); break;
    case 'stomp':  tone(t,0.12,500,0.12,W.w50,140); break;
    case 'trophy': ['C5','E5','G5','C6','E6'].forEach((n,k)=>tone(t+k*0.07,0.12,freq(n),0.1,W.w25)); break;

// --- WebHID fallback for retro pads whose d-pad is broken in the Gamepad API ---
// (e.g. DragonRise SNES clones where left/right never reach the browser).
// Press H once: pick the controller, then follow the two calibration prompts.
const hid={dev:null,map:null,rest:null,x:0,y:0,calib:null,hold:null};
function hidSetHint(t){ ui.textContent=t; }
async function hidConnect(){
  if(!navigator.hid){ hidSetHint('This browser has no WebHID - use keyboard controls'); return; }
  try{
    const devs=await navigator.hid.requestDevice({filters:[]});
    if(!devs.length) return;
    hid.dev=devs[0];
    if(!hid.dev.opened) await hid.dev.open();
    const key='hidmap_'+hid.dev.vendorId+'_'+hid.dev.productId;
    let saved=null;
    try{ saved=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
    hid.map=saved; hid.rest=null;
    hid.calib=saved?null:{stage:0,t:0,key};
    hid.dev.oninputreport=ev=>{
      const d=new Uint8Array(ev.data.buffer);
      if(!hid.rest){ hid.rest=[...d]; return; }
      if(hid.calib) hidCalibrate(d);
      else if(hid.map) hidApply(d);
    };
    if(hid.calib) hidSetHint('CALIBRATE: hold d-pad RIGHT until confirmed...');
    else hidSetHint('retro pad linked! d-pad ready');
  }catch(e){ hidSetHint('controller link cancelled'); }
}
function hidDeviation(d){
  for(let i=0;i<Math.min(d.length,hid.rest.length);i++){
    const dv=d[i]-hid.rest[i];
    if(Math.abs(dv)>40) return {i,val:d[i],sign:Math.sign(dv)};
  }
  return null;
}
function hidCalibrate(d){
  const dev=hidDeviation(d);
  const c=hid.calib;
  if(dev){
    if(c.cand && c.cand.i===dev.i && c.cand.sign===dev.sign) c.t++;
    else { c.cand=dev; c.t=1; }
    if(c.t>25){                                  // held steadily
      if(c.stage===0){
        c.xi=dev.i; c.xSign=dev.sign;
        c.stage=1; c.cand=null; c.t=-40;         // debounce gap
        hidSetHint('Good! now hold d-pad DOWN until confirmed...');
      } else {
        hid.map={xi:c.xi,xSign:c.xSign,yi:dev.i,ySign:dev.sign,rest:[...hid.rest]};
        try{ localStorage.setItem(c.key, JSON.stringify(hid.map)); }catch(e){}
        hid.calib=null;
        hidSetHint('retro pad calibrated!');
      }
    }
  } else if(c.t>0) c.t=0;
}
function hidApply(d){
  const m=hid.map;
  const dx=d[m.xi]-m.rest[m.xi], dy=d[m.yi]-m.rest[m.yi];
  hid.x=Math.abs(dx)>40?(Math.sign(dx)===m.xSign?1:-1):0;
  hid.y=Math.abs(dy)>40?(Math.sign(dy)===m.ySign?1:-1):0;
}
addEventListener('keydown',e=>{ if(e.code==='KeyH') hidConnect(); });

function pollPads(){
  const out=[];
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const p of pads){
    if(!p||!p.connected) continue;
    const dz=0.3, ax=p.axes[0]||0, ay=p.axes[1]||0;
    let gx=Math.abs(ax)>dz?Math.sign(ax):0;
    let gy=Math.abs(ay)>dz?Math.sign(ay):0;
    if(out.length===0 && hid.map){
      // calibrated raw-HID d-pad override for the linked retro pad (first pad)
      gx=hid.x; gy=hid.y;
    } else {
      if(p.buttons[14]&&p.buttons[14].pressed) gx=-1;   // d-pad left
      if(p.buttons[15]&&p.buttons[15].pressed) gx=1;    // d-pad right
      if(p.buttons[12]&&p.buttons[12].pressed) gy=-1;   // d-pad up
      if(p.buttons[13]&&p.buttons[13].pressed) gy=1;    // d-pad down
    }
    // accept/back buttons are user-configurable (Settings -> CONTROLS)
    const a=padPressedAny(p, BTN_ACCEPT);   // advance / confirm / jump
    const b=padPressedAny(p, BTN_BACK);     // back / cancel / jump
    const jump=a||b;                        // any mapped button jumps in-game
    const start=!!(p.buttons[9]&&p.buttons[9].pressed);
    const pressed=[];   // raw indices held (d-pad 12-15 reserved for navigation)
    for(let bi=0;bi<p.buttons.length;bi++){
      if(bi>=12&&bi<=15) continue;
      if(p.buttons[bi]&&p.buttons[bi].pressed) pressed.push(bi);
    }
    out.push({gx,gy,a,b,jump,start,pressed});
  }
  return out;
}

// ---- IndexedDB key/value store (foundation for saves/progress later) ----
const IDB={name:'mousesquad',ver:1,store:'kv',db:null};
function idbOpen(){
  return new Promise((res)=>{
    let r;
    try{ r=indexedDB.open(IDB.name,IDB.ver); }catch(e){ return res(null); }
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB.store)) r.result.createObjectStore(IDB.store); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>res(null);
  });
}
async function idbGet(key){
  try{ const db=IDB.db||(IDB.db=await idbOpen()); if(!db) return undefined;
    return await new Promise((res)=>{ const t=db.transaction(IDB.store,'readonly').objectStore(IDB.store).get(key);
      t.onsuccess=()=>res(t.result); t.onerror=()=>res(undefined); }); }
  catch(e){ return undefined; }
}
async function idbSet(key,val){
  try{ const db=IDB.db||(IDB.db=await idbOpen()); if(!db) return;
    await new Promise((res)=>{ const t=db.transaction(IDB.store,'readwrite').objectStore(IDB.store).put(val,key);
      t.onsuccess=()=>res(); t.onerror=()=>res(); }); }
  catch(e){}
}

// ---- configurable controller buttons (any count per role) ----
let BTN_ACCEPT=[0,1], BTN_BACK=[2,3];        // defaults until storage loads
function saveButtonMap(){
  const m={accept:BTN_ACCEPT.slice(), back:BTN_BACK.slice()};
  try{ localStorage.setItem('ms_btnmap', JSON.stringify(m)); }catch(e){}  // fast sync mirror
  idbSet('buttonMap', m);                                                 // durable store
}
function loadButtonMap(){
  // sync mirror first (instant), then reconcile from IndexedDB
  try{ const m=JSON.parse(localStorage.getItem('ms_btnmap')||'null');
       if(m&&m.accept&&m.back){ BTN_ACCEPT=m.accept; BTN_BACK=m.back; } }catch(e){}
  idbGet('buttonMap').then(m=>{ if(m&&m.accept&&m.back){ BTN_ACCEPT=m.accept; BTN_BACK=m.back; } });
}
function padPressedAny(p, list){ return list.some(i=>p.buttons[i]&&p.buttons[i].pressed); }
// ---- controller button remap screen ----
let remapStep=0;             // 0 = capture ACCEPT, 1 = capture BACK
let wAccept=new Set(), wBack=new Set(), remapLast=-1;
function enterRemap(){
  titlePhase='remap'; remapStep=0; remapLast=-1;
  wAccept=new Set(BTN_ACCEPT); wBack=new Set(BTN_BACK);
}
function remapToggle(idx){    // a controller button was pressed during capture
  remapLast=idx;
  const cur = remapStep===0 ? wAccept : wBack;
  const other = remapStep===0 ? wBack : wAccept;
  if(cur.has(idx)) cur.delete(idx);
  else { cur.add(idx); other.delete(idx); }   // a button belongs to one role
}
function remapNext(){        // d-pad RIGHT
  if(remapStep===0){ remapStep=1; }
  else { // save if valid
    if(wAccept.size===0) return;               // must have at least one accept
    BTN_ACCEPT=[...wAccept].sort((a,b)=>a-b);
    BTN_BACK=[...wBack].sort((a,b)=>a-b);
    saveButtonMap();
    titlePhase='settings';
  }
}
function remapPrev(){         // d-pad LEFT
  if(remapStep===1) remapStep=0;
  else titlePhase='settings';                  // cancel (no save)
}


// ================= input sources: each controller + the keyboard/touch =================
// Controllers are players first; the keyboard (or touch) joins as the next player.
const ui=document.getElementById('ui');
const keys={};
let state='title', titlePhase='menu', stateT=0, menuSel=0, setSel=0, pauseSel=0, numSel=0;
const SET_ROWS=4;                   // MUSIC, DIFFICULTY, CRT, CONTROLS
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Backspace'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  if(state==='title' && titlePhase==='remap' && /^Digit[0-9]$/.test(e.code)) remapToggle(parseInt(e.code.slice(5)));
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
const touch={x:0,y:0,a:false,b:false,start:false};
let lastPads=[];                     // set every frame by the loop
function sourceList(){
  const s=lastPads.map((_,i)=>'pad'+i);
  if(!(isTouchDevice && s.length)) s.push('kb');     // touch phones with pads: pads only
  return s;
}
function maxPlayers(){ return Math.min(3, sourceList().length); }
function readSource(src){
  if(src==='kb'){
    const dx=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0)||touch.x;
    const dy=(keys.ArrowUp||keys.KeyW?-1:0)+(keys.ArrowDown||keys.KeyS?1:0)||touch.y;
    return {dx:Math.sign(dx), dy:Math.sign(dy),
      a:!!(keys.Space||keys.KeyZ||keys.Enter||touch.a),
      b:!!(keys.KeyX||keys.Backspace||keys.ShiftLeft||keys.ShiftRight||touch.b),
      start:!!(keys.KeyP||keys.Escape||touch.start)};
  }
  const p=lastPads[+src.slice(3)];
  if(!p) return {dx:0,dy:0,a:false,b:false,start:false};
  return {dx:p.gx, dy:p.gy, a:p.a, b:p.b, start:p.start};
}
const srcPrev={}, srcCur={};
function pollSources(){
  for(const s of ['pad0','pad1','pad2','pad3','kb']){
    srcPrev[s]=srcCur[s]||{dx:0,dy:0,a:false,b:false,start:false};
    srcCur[s]=readSource(s);
  }
}
function edge(src,k){ const c=srcCur[src], p=srcPrev[src]; if(!c||!p) return 0;
  if(k==='dx'||k==='dy') return (c[k]!==0 && p[k]===0)?c[k]:0;
  return c[k]&&!p[k]; }
function anyEdge(k){ for(const s of sourceList()){ const e=edge(s,k); if(e) return e; } return 0; }

let prePauseState = 'play';
function togglePause(){
  if(state==='play' || state==='bonus' || state==='doodle'){ prePauseState=state; state='paused'; pauseSel=0; }
  else if(state==='paused') state=prePauseState;
}
function pauseConfirm(){ if(pauseSel===0) state=prePauseState; else { savedL1State=null; savedL3State=null; toTitle(); } }
addEventListener('gamepadconnected',()=>{ gamepadOn=true; applyLayout(); });
addEventListener('gamepaddisconnected',()=>{ gamepadOn=false; applyLayout(); });

// ---------- touch: d-pad + A / B / pause feed the 'kb' source ----------
{
  const el=id=>document.getElementById(id);
  const zone=el('stickzone'), dpad=el('dpad');
  const arms={up:el('d-up'),down:el('d-down'),left:el('d-left'),right:el('d-right')};
  let dirTouch=null;
  function setDir(x,y){
    touch.x=x; touch.y=y;
    arms.up.classList.toggle('on',y<0); arms.down.classList.toggle('on',y>0);
    arms.left.classList.toggle('on',x<0); arms.right.classList.toggle('on',x>0);
  }
  function dirFrom(t){
    const r=dpad.getBoundingClientRect();
    const dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2), mag=Math.hypot(dx,dy);
    if(mag<20){ setDir(0,0); return; }
    setDir(Math.abs(dx)>mag*0.42?Math.sign(dx):0, Math.abs(dy)>mag*0.42?Math.sign(dy):0);
  }
  zone.addEventListener('touchstart',e=>{ e.preventDefault(); if(dirTouch===null){ const t=e.changedTouches[0]; dirTouch=t.identifier; dirFrom(t); } },{passive:false});
  zone.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===dirTouch){ dirFrom(t); break; } },{passive:false});
  for(const ev of ['touchend','touchcancel']) zone.addEventListener(ev,e=>{
    e.preventDefault(); for(const t of e.changedTouches) if(t.identifier===dirTouch){ dirTouch=null; setDir(0,0); }
  },{passive:false});
  for(const [id,k] of [['btnA','a'],['btnB','b'],['pausebtn','start']]){
    const btn=el(id);
    btn.addEventListener('touchstart',e=>{ e.preventDefault(); btn.classList.add('on'); touch[k]=true; },{passive:false});
    for(const ev of ['touchend','touchcancel']) btn.addEventListener(ev,e=>{ e.preventDefault(); btn.classList.remove('on'); touch[k]=false; },{passive:false});
  }
}
let gamepadOn=false;
function applyLayout(){ setPadVisible(isTouchDevice && !gamepadOn); }

// ---------- settings: what you see is what's saved ----------
function enterSettings(){ titlePhase='settings'; setSel=0; }
function settingsChange(dx){
  if(setSel===0){ const on=!musicOn(); applyMusic(on); setSoundPref(on?'on':'off'); }
  else if(setSel===1){ diffSel=(diffSel+(dx>0?1:-1)+DIFFS.length)%DIFFS.length; try{ localStorage.setItem('ms_diff',diffSel); }catch(e){} }
  else if(setSel===2){ applyCRT(!crtOn); try{ localStorage.setItem('ms_crt',crtOn?'1':'0'); }catch(e){} }
  sfx('select');
}
function settingsConfirm(){ if(setSel===3) enterRemap(); else settingsChange(1); }

// ---------- character select: every player drives their own cursor ----------
const MENU=['START','SETTINGS'];
let joined=[];          // [{src, cur, locked}]
function enterSelect(n){
  const src=sourceList().slice(0,n);
  joined=src.map((s,k)=>({src:s, cur:[1,0,2][k], locked:false}));
  titlePhase='select'; stateT=0;
}
function takenBy(i){ return joined.find(j=>j.locked && j.cur===i); }
function selectUpdate(){
  joined.forEach((j,k)=>{
    const dx=edge(j.src,'dx');
    if(dx && !j.locked){ j.cur=(j.cur+(dx>0?1:2))%3; sfx('select'); }
    if(edge(j.src,'a')||edge(j.src,'start')){
      if(!j.locked && !takenBy(j.cur)){ j.locked=true; sfx('confirm'); }
    }
    if(edge(j.src,'b')){
      if(j.locked) j.locked=false;
      else if(k===0){ titlePhase=maxPlayers()>1?'players':'menu'; }
    }
  });
  if(titlePhase==='select' && joined.length && joined.every(j=>j.locked)){
    if(++stateT>36) beginGame(joined.map(j=>({id:MICE[j.cur], src:j.src})));
  } else stateT=0;
}
// ---------- menus (any source navigates) ----------
function titleUpdate(){
  if(titlePhase==='select'){ selectUpdate(); return; }
  if(titlePhase==='remap'){
    // capture is handled from raw pad presses; any d-pad steps through
    const dx=anyEdge('dx'); if(dx>0) remapNext(); else if(dx<0) remapPrev();
    return;
  }
  const dy=anyEdge('dy'), dx=anyEdge('dx'), a=anyEdge('a')||anyEdge('start'), b=anyEdge('b');
  if(titlePhase==='menu'){
    if(dy){ menuSel=(menuSel+(dy>0?1:MENU.length-1))%MENU.length; sfx('select'); }
    if(a){ sfx('confirm');
      if(menuSel===0){ if(maxPlayers()>1){ titlePhase='players'; numSel=0; } else enterSelect(1); }
      else enterSettings(); }
  } else if(titlePhase==='players'){
    const n=maxPlayers();
    if(dy||dx){ numSel=(numSel+((dy||dx)>0?1:n-1))%n; sfx('select'); }
    if(numSel>=n) numSel=n-1;
    if(a){ sfx('confirm'); enterSelect(numSel+1); }
    if(b) titlePhase='menu';
  } else if(titlePhase==='settings'){
    if(dy) setSel=(setSel+(dy>0?1:SET_ROWS-1))%SET_ROWS; else if(dx) settingsChange(dx);
    if(a) settingsConfirm();
    if(b) titlePhase='menu';
  }
}


// ================= game flow =================
let camX=0, picks=[], highScore=0, newHigh=false, confetti=[], banner=0;
try{ highScore=+localStorage.getItem('ms_high')||0; }catch(e){}
idbGet('highScore').then(v=>{ if(v>highScore) highScore=v; });
function toTitle(){ state='title'; titlePhase='menu'; stateT=0; setTrack('street'); }
function beginGame(pk){
  picks=pk; score=0; trophies=[false,false,false,false]; checkpoint=80;
  currentLevel=1;
  triggerSplash(1);
}
function triggerSplash(lvl){
  splashLevel=lvl; state='splash'; splashT=0; sfx('confirm');
}
function nextAfterSplash(){
  currentLevel=splashLevel; checkpoint=80; trophies=[false,false,false,false];
  buildLevel(currentLevel); startRun();
}
function startRun(){            // everyone back at the last checkpoint with 3 lives
  spawnPlayers(picks, checkpoint);
  if(currentLevel===4){ resetBoss(); arenaLocked=false; leftWall=0; rightWall=LEVEL_LEN; camX=Math.max(0,Math.min(ARENA_X,checkpoint-300)); }
  else if(currentLevel===3){ arenaLocked=false; playgroundExitActive=false; playgroundExitTimer=0; leftWall=0; rightWall=LEVEL_LEN; camX=Math.max(0,Math.min(ARENA_X,checkpoint-300)); }
  else if(currentLevel===2){ arenaLocked=false; level1ExitActive=false; level1ExitTimer=0; leftWall=0; rightWall=LEVEL_LEN; camX=Math.max(0,Math.min(ARENA_X,checkpoint-300)); }
  else {
    arenaLocked=false; classroomExitActive=false; classroomExitTimer=0;
    compSuckSeq={active:false,timer:0,done:false,flash:0};
    compEjectSeq={active:false,timer:0,done:false,flash:0};
    if(checkpoint >= 4900){
      l1Zone = 3; leftWall = 4920; rightWall = LEVEL_LEN_1; ARENA_X = LEVEL_LEN_1 - WNAT;
      compSuckSeq.done = true; compEjectSeq.done = true;
      camX = Math.max(4700, Math.min(LEVEL_LEN_1 - WNAT, checkpoint - 300));
    } else if(checkpoint >= 2500){
      l1Zone = 2; leftWall = 2520; rightWall = 4900; ARENA_X = 4900 - WNAT;
      compSuckSeq.done = true; compEjectSeq.done = false;
      camX = Math.max(2500, Math.min(4900 - WNAT, checkpoint - 300));
    } else {
      l1Zone = 1; leftWall = 0; rightWall = 2520; ARENA_X = 2520 - WNAT;
      compSuckSeq.done = false; compEjectSeq.done = false;
      camX = Math.max(0, Math.min(2050, checkpoint - 300));
    }
  }
  state='play'; stateT=0; banner=150; setTrack('street');
}
function onBossGone(){
  trophies[3]=true;
  addScore(5000);                                           // boss defeated
  for(const p of alivePlayers()) addScore(500*p.lives);     // lives bonus
  newHigh=score>highScore;
  if(newHigh){ highScore=score; try{ localStorage.setItem('ms_high',score); }catch(e){} idbSet('highScore',score); }
  idbSet('lastRun',{score,trophies:trophies.slice(),mice:picks.map(p=>p.id),diff:diffSel,date:Date.now()});
  state='win'; stateT=0; confetti=[]; winJingle();
}
function continueScreen(){
  if(stateT<30) return;                                     // don't skip by accident
  if(state==='gameover') startRun();
  else if(state==='win'){ state='victory'; stateT=0; sfx('trophy'); }
  else if(state==='victory') toTitle();
}
function reviveAtCheckpoint(){     // knocked-out players rejoin when the team reaches a checkpoint
  const lead=alivePlayers()[0];
  for(const p of players) if(p.out){ p.out=false; p.lives=2; Object.assign(p.b,newBody(p.id,lead.b.x-40,FEET)); p.b.inv=120; }
}

// ================= frame-level input (edges are read once per frame) =================
function frameInput(){
  if(state==='splash'){
    if((anyEdge('a')||anyEdge('b')||anyEdge('start')) && splashT>15) nextAfterSplash();
    return;
  }
  if(state==='title'){ titleUpdate(); return; }
  if(state==='play'){
    for(const p of players){
      if(edge(p.src,'a')||edge(p.src,'b')) p.jq=true;
      if(edge(p.src,'start')) togglePause();
      const s=readSource(p.src);
      if(edge(p.src,'dy')===-1 || (s.dy<0 && !p.prevUp)) p.upPressed=true;
      p.prevUp=s.dy<0;
    }
  } else if(state==='bonus' || state==='doodle'){
    for(const p of players){
      if(edge(p.src,'a')||edge(p.src,'b')) p.jq=true;
      if(edge(p.src,'start')) togglePause();
    }
  } else if(state==='paused'){
    const dy=anyEdge('dy'); if(dy) pauseSel=(pauseSel+1)%2;
    if(anyEdge('a')) pauseConfirm(); else if(anyEdge('b')||anyEdge('start')) state=prePauseState;
  } else if(anyEdge('a')||anyEdge('start')) continueScreen();
}

// ================= simulation (fixed 60 ticks/s) =================
let frame=0;
function tick(){
  frame++; stateT++;
  if(banner>0) banner--;
  if(shake>0) shake*=0.85, shake<0.5&&(shake=0);
  for(const c of crates) if(c.squash>0) c.squash--;
  if(state==='splash'){ splashT++; if(splashT>160) nextAfterSplash(); return; }
  if(state==='win'||state==='victory'){ stepConfetti(); return; }
  if(state==='bonus'){ tickBonus(); return; }
  if(state==='doodle'){ tickDoodle(); return; }
  if(state!=='play') return;
  if(doorEntrySeq.active){ tickDoorEntry(); return; }

  // Level 3 Seesaw Angular Physics
  if(currentLevel === 3){
    for(const c of crates){
      if(c.t === 'seesaw'){
        const cx = c.x + c.w / 2;
        let torque = 0, someoneOn = false;
        for(const p of alivePlayers()){
          const b = p.b;
          if(b.x >= c.x - 6 && b.x <= c.x + c.w + 6 && b.y >= c.y - 20 && b.y <= FEET + 4){
            const dist = b.x - cx;
            torque += dist * 0.00032;
            someoneOn = true;
          }
        }
        if(!someoneOn){
          torque += -(c.angle || 0) * 0.025;
        }
        c.omega = ((c.omega || 0) + torque) * 0.86;
        c.angle = (c.angle || 0) + c.omega;
        const maxA = 0.26;
        if(c.angle > maxA){ c.angle = maxA; c.omega = 0; }
        if(c.angle < -maxA){ c.angle = -maxA; c.omega = 0; }
      }
    }
  }

  // Mega Trampoline Rocket Launch sequence: rocket straight up past the top of the screen!
  if(trampLaunch && trampLaunch.active){
    const lp = trampLaunch.player;
    if(frame % 2 === 0){
      fx.push({t:'star', x: lp.b.x + (Math.random()-0.5)*18, y: lp.b.y + 12, age: 0, small: true});
    }
    for(const p of alivePlayers()){
      if(p !== lp && p.b.ground){
        p.b.vy = -26.0;
        p.b.ground = false;
      }
    }
    if(lp.b.y <= 0){
      const playerToStart = lp;
      trampLaunch = null;
      startSkyDoodleMiniGame(playerToStart);
      return;
    }
  }

  // Parachute return descent into Playground
  if(parachuteDescentActive){
    let anyParachute = false;
    for(const p of alivePlayers()){
      if(p.parachute){
        anyParachute = true;
        p.b.vy = 1.6;
        p.b.y += p.b.vy;
        p.b.x += Math.sin(frame * 0.06 + p.b.x * 0.05) * 0.8;
        if(p.b.y >= FEET - 44){
          p.b.y = FEET - 44;
          p.b.vy = -3.2;
          p.b.ground = false;
          p.parachute = false;
          sfx('spring');
          fx.push({t:'star', x: p.b.x, y: FEET - 44, age: 0, small: true});
          const tramp = crates.find(c => c.t === 'mega_trampoline');
          if(tramp) tramp.squash = 12;
        }
      }
    }
    if(!anyParachute){
      parachuteDescentActive = false;
    }
  }

  for(const p of alivePlayers()){
    const s=srcCur[p.src]||{dx:0,dy:0,a:false,b:false};
    p.b.jheld=!!(s.a||s.b);
    moveBody(p.b,s.dx,!!p.jq,s.dy); p.jq=false;
    // keep everyone on screen together (unless launched or parachuting)
    if(!arenaLocked && !p.parachute && (!trampLaunch || !trampLaunch.active)) p.b.x=Math.max(camX+22,Math.min(camX+WNAT-22,p.b.x));
  }
  if(currentLevel===2){
    for(const p of alivePlayers()){
      if(p.upPressed){
        p.upPressed=false;
        for(let i=0; i<L1_DOORS.length; i++){

            }

        for(const p of live){ p.b.vx = 0; p.exitFade = 0; }
      }
      if(playgroundExitTimer >= 155){
        playgroundExitActive = false;
        for(const p of live){ p.exitFade = undefined; p.exitScale = undefined; }
        triggerSplash(4); // Level 3 completes -> proceeds to Level 4 (Main Street & Boss)!
        return;
      }
    }
  } else {
    // Level 4 (Main Street, previously Level 3)
    if(maxX>CHECKPOINT_X && checkpoint<CHECKPOINT_X){
      checkpoint=CHECKPOINT_X; reviveAtCheckpoint();
      fx.push({t:'pts',x:CHECKPOINT_X,y:FEET-140,txt:'CHECKPOINT',age:0}); sfx('confirm');
    }
    if(!arenaLocked && maxX>ARENA_X+20){
      arenaLocked=true; leftWall=ARENA_X; rightWall=LEVEL_LEN; boss.state='enter'; setTrack(null);
      enemies.forEach(e=>{ if(e.x>ARENA_X-100) e.alive=false; });
      for(const p of live) p.b.x=Math.max(p.b.x,ARENA_X+30);
    }
    bossAI(); if(state==='play') bossCollide();
  }
  for(const k of koFx){ k.vy+=0.5; k.y+=k.vy; k.x+=k.vx; k.rot+=0.25; }
  koFx=koFx.filter(k=>k.y<HNAT+200);
  for(const f of fx) f.age++;
  fx=fx.filter(f=>f.age<(f.t==='pts'?50:f.t==='star'?22:30));
  // camera: centre the group (look ahead when solo), lock in the arena
  const solo=live.length===1?live[0].b:null;
  const target=arenaLocked?ARENA_X:(solo?solo.x-330+solo.face*50:avgX-WNAT/2);
  camX+=(target-camX)*0.1;
  let minCam=0, maxCam=ARENA_X;
  if(currentLevel===1){
    if(l1Zone===1){ minCam=0; maxCam=2050; }
    else if(l1Zone===2){ minCam=2500; maxCam=4470; }
    else if(l1Zone===3){ minCam=4732; maxCam=Math.max(4732, LEVEL_LEN_1 - WNAT); }
  }
  camX=Math.max(minCam,Math.min(maxCam,camX));
}

let padPrev=[], lastPadCount=0;
function padEdges(pads){
  for(let i=0;i<pads.length;i++){
    const pad=pads[i];
    if((pad.jump||pad.start||pad.gx||pad.gy) && soundPref()!=='off'){
      if(!actx){ initAudio(); setTrack(pendingTrack); }
      if(actx.state==='suspended') actx.resume().catch(()=>{});
    }
    const prev=padPrev[i]||{pressed:[]};
    if(state==='title' && titlePhase==='remap'){
      const now=pad.pressed||[], was=prev.pressed||[];
      for(const idx of now) if(!was.includes(idx)) remapToggle(idx);
    }
    padPrev[i]={pressed:pad.pressed||[]};
  }
  padPrev.length=pads.length;
}

function drawCyberspaceScenery(){
  rect(0, 0, WNAT, HNAT, '#050713');

  const relCam = camX - 2500;
  const streamStep = 120;
  for(let c = -1; c < 12; c++){
    const sx = c * streamStep - ((relCam * 0.5) % streamStep + streamStep) % streamStep;
    if(sx > -30 && sx < WNAT + 30){
      const streamY = (frame * (1.2 + (Math.abs(c) % 5) * 0.4) + Math.abs(c) * 80) % (HNAT + 120) - 60;
      for(let r = 0; r < 8; r++){
        const by = streamY - r * 14;
        if(by > 0 && by < FEET){
          const char = ((Math.abs(c) * 7 + r * 13 + Math.floor(frame / 15)) % 2 === 0) ? '0' : '1';
          const alpha = Math.max(0.1, 1 - r * 0.13);
          const col = (r === 0) ? '#FFFFFF' : ((Math.abs(c) % 2 === 0) ? '#00E5FF' : '#00FF66');
          ctx.globalAlpha = alpha * 0.55;
          text(char, sx, by, 1.4, col, 'c');
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  const towerStep = 280;
  for(let i = -1; i < 6; i++){
    const sx = i * towerStep - ((relCam * 0.35) % towerStep + towerStep) % towerStep;
    if(sx > -120 && sx < WNAT + 120){
      rrect(sx, 120, 80, FEET - 120, 4); ctx.fillStyle = '#090F24'; ctx.fill();
      rect(sx + 2, 122, 76, 3, '#00E5FF');
      for(let by = 135; by < FEET - 20; by += 26){
        rect(sx + 6, by, 68, 20, '#0D1636');
        rect(sx + 10, by + 16, 40, 2, '#1E2950');
        const ledOn = Math.sin(frame * 0.1 + Math.abs(i) * 5 + by) > 0;
        const ledCol = (by % 52 === 0) ? '#00FF66' : ((by % 78 === 0) ? '#FF1744' : '#FFD600');
        disc(sx + 58, by + 10, 2.5, 2.5, ledOn ? ledCol : '#111827');
        disc(sx + 66, by + 10, 2.5, 2.5, ledOn ? '#00E5FF' : '#111827');
      }
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.25)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx + 4, 130); ctx.lineTo(sx + 4, FEET - 10);
      ctx.moveTo(sx + 76, 130); ctx.lineTo(sx + 76, FEET - 10);
      ctx.stroke();
    }
  }

  const horizonY = 270;
  rect(0, horizonY, WNAT, HNAT - horizonY, '#060A1C');
  rect(0, horizonY, WNAT, 2, '#FF007F');
  rect(0, horizonY - 1, WNAT, 1, 'rgba(255, 0, 127, 0.4)');

  const vpx = WNAT / 2;
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.45)'; ctx.lineWidth = 1.5;
  for(let gx = -WNAT; gx <= WNAT * 2; gx += 70){
    const sx = gx - (camX % 70);
    ctx.beginPath();
    ctx.moveTo(vpx + (sx - vpx) * 0.1, horizonY);
    ctx.lineTo(vpx + (sx - vpx) * 2.2, HNAT);
    ctx.stroke();
  }

  for(let k = 1; k <= 9; k++){
    const t = Math.pow(k / 9, 2.2);
    const hy = horizonY + (HNAT - horizonY) * t;
    const scrollOff = ((frame * 0.8) % 1) * ((HNAT - horizonY) / 9);
    const lineY = Math.min(HNAT - 1, hy + scrollOff * t);

    ctx.lineWidth = 1 + t * 1.5;
    ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(WNAT, lineY); ctx.stroke();
  }

  rect(0, FEET, WNAT, 3, '#00E5FF');
  rect(0, FEET + 3, WNAT, HNAT - FEET - 3, 'rgba(0, 229, 255, 0.08)');
}

function drawSplashPixelChar(grid, x, y, size, col, outline = 4){
  const rows = grid.length, cols = grid[0].length;
  ctx.fillStyle = '#000000';
  for(let r = 0; r < rows; r++){
    for(let c = 0; c < cols; c++){
      if(grid[r][c] === '#'){
        ctx.fillRect(R(x + c * size - outline), R(y + r * size - outline), R(size + outline * 2), R(size + outline * 2 + 2));
      }
    }
  }
  ctx.fillStyle = col;
  for(let r = 0; r < rows; r++){
    for(let c = 0; c < cols; c++){
      if(grid[r][c] === '#'){
        ctx.fillRect(R(x + c * size), R(y + r * size), R(size), R(size));
      }
    }
  }
}

const _playerDrawOrder = [];
function drawPlayers(){
  const multi=players.length>1;
  // draw back-to-front so nobody hides behind a later player's tail
  _playerDrawOrder.length = 0;
  for(let i=0; i<players.length; i++) _playerDrawOrder.push(i);
  _playerDrawOrder.sort((a,b)=>players[a].b.y - players[b].b.y);
  for(let idx=0; idx<_playerDrawOrder.length; idx++){
    const k = _playerDrawOrder[idx];
    const p = players[k];
    if(p.out) continue;
    const fade = p.exitFade !== undefined ? p.exitFade : 1;
    const holo = p.holoAlpha !== undefined ? p.holoAlpha : 1;
    if(fade <= 0 || holo <= 0) continue; // Stepped through the door or dematerialized!
    const b=p.b;
    const sc = p.exitScale !== undefined ? p.exitScale : (p.suckScale !== undefined ? p.suckScale : (p.ejectScale !== undefined ? p.ejectScale : 1));
    const rot = p.suckRot || 0;
    ctx.save();
    if(sc !== 1 || rot !== 0){
      ctx.translate(R(b.x - camX), R(b.y - 30));
      if(rot) ctx.rotate(rot);
      if(sc !== 1) ctx.scale(sc, sc);
      ctx.translate(-R(b.x - camX), -R(b.y - 30));
    }
    shadowAt(b.x, b.y, 26 * fade * holo);
    const blink=b.inv>0 && Math.floor(b.inv/4)%2===0;
    const alpha=(blink?0.35:1) * fade * holo;
    if(p.parachute){
      drawDoodleParachute(b.x - camX, b.y);
    }
    drawMouse(p.id,b.x,b.y,b.face,mouseFrame(b),alpha,k*2);
    if(p.holoGlitch){
      const pw = 42, ph = 54, px = R(b.x - camX - pw/2), py = R(b.y - ph + 2);
      ctx.fillStyle = 'rgba(0, 229, 255, 0.28)';
      ctx.fillRect(px, py, pw, ph);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      for(let sl = (frame * 3) % 6; sl < ph; sl += 6){
        ctx.fillRect(px, py + sl, pw, 2);
      }
    }
    if(multi && fade > 0.3 && holo > 0.3){
      const h=SPR[p.id+'_idle'].height, tx=b.x-camX, ty=b.y-h-14;
      text('P'+(k+1),tx,ty,2,PCOL[k],'c','#000');
      ctx.fillStyle=PCOL[k]; ctx.beginPath(); ctx.moveTo(R(tx-4),R(ty+12)); ctx.lineTo(R(tx+4),R(ty+12)); ctx.lineTo(R(tx),R(ty+16)); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBoss(){

  const img=(boss.face>0?SPRL:SPR)[name];

  ctx.drawImage(ATLAS,img.sx,img.sy,img.width,img.height,R(x-w/2),R(boss.y-h),w,R(h));

    ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2;

function startSecretDoorEntry(drIdx, player){
  doorEntrySeq = { active: true, timer: 0, drIdx: drIdx, player: player };
  sfx('secret');
  for(const p of alivePlayers()){
    if(p.b.ground) p.b.vy = -4.5;
  }
}

function tickDoorEntry(){
  doorEntrySeq.timer++;
  const dr = L1_DOORS[doorEntrySeq.drIdx];
  const drCenter = dr.x + 47;
  const live = alivePlayers();
  for(let k = 0; k < live.length; k++){
    const p = live[k];
    const targetX = drCenter + (k - (live.length - 1) / 2) * 20;
    p.b.vx = Math.sign(targetX - p.b.x) * Math.min(2.0, Math.abs(targetX - p.b.x) * 0.2);
    p.b.face = 1;
    p.b.inv = 10;
    if(doorEntrySeq.timer > 20){
      p.exitFade = Math.max(0, 1 - (doorEntrySeq.timer - 20) / 22);
      p.exitScale = Math.max(0.4, 1 - (doorEntrySeq.timer - 20) * 0.025);
    }
  }
  if(doorEntrySeq.timer >= 46){
    doorEntrySeq.active = false;
    for(const p of live){ p.exitFade = undefined; p.exitScale = undefined; }
    saveL1State(doorEntrySeq.drIdx);
    startBonusStage();
  }
}

function saveL1State(doorIdx){
  savedL1State = {
    doorIdx: doorIdx,
    camX: camX,
    checkpoint: checkpoint,
    trophies: trophies.slice(),
    enemies: enemies.map(e => ({...e})),
    pickups: pickups.map(p => ({...p})),
    crates: crates.map(c => ({...c})),
    shots: shots.map(s => ({...s})),
    fx: fx.map(f => ({...f})),
    players: players.map(p => ({
      id: p.id,
      src: p.src,
      lives: p.lives,
      out: p.out,
      bx: p.b.x,
      by: p.b.y,
      face: p.b.face
    })),
    score: score,
    leftWall: leftWall,
    rightWall: rightWall
  };
}

function restoreL1State(bonusPts){
  if(!savedL1State) return;
  camX = savedL1State.camX;
  checkpoint = savedL1State.checkpoint;
  trophies = savedL1State.trophies.slice();
  enemies = savedL1State.enemies.map(e => ({...e}));
  pickups = savedL1State.pickups.map(p => ({...p}));
  crates = savedL1State.crates.map(c => ({...c}));
  shots = savedL1State.shots.map(s => ({...s}));
  fx = savedL1State.fx.map(f => ({...f}));
  leftWall = savedL1State.leftWall;
  rightWall = savedL1State.rightWall;
  score = savedL1State.score;

  const dr = L1_DOORS[savedL1State.doorIdx] || {x: 400};
  const doorCenterX = dr.x + 47;
  const liveCount = savedL1State.players.filter(p => !p.out).length;
  let liveIdx = 0;

  players = savedL1State.players.map((sp, k) => {
    const p = {
      id: sp.id,
      src: sp.src,
      lives: sp.lives,
      out: sp.out,
      b: newBody(sp.id, doorCenterX, FEET),
      jq: false,
      upPressed: false,
      prevUp: false
    };
    if(!p.out){
      const off = (liveIdx - (liveCount - 1) / 2) * 26;
      p.b.x = doorCenterX + off;
      p.b.y = FEET;
      p.b.vx = 0;
      p.b.vy = 0;
      p.b.ground = true;
      p.b.inv = 90;
      p.b.face = 1;
      liveIdx++;
    }
    p.exitFade = undefined;
    p.exitScale = undefined;
    return p;
  });

  if(bonusPts > 0){
    addScore(bonusPts, doorCenterX, FEET - 120);
    fx.push({t:'pts', x: doorCenterX, y: FEET - 140, txt: '+' + bonusPts + ' BONUS!', age: 0, big: true});
    fx.push({t:'star', x: doorCenterX, y: FEET - 100, age: 0});
  }

  bonusPlayed = true;
  savedL1State = null;
  state = 'play';
  stateT = 0;
  setTrack('street');
}

function tickBonus(){
  stateT++;
  for(let i = bonusFx.length - 1; i >= 0; i--){
    const f = bonusFx[i];
    f.age++;
    if(f.age > 45) bonusFx.splice(i, 1);
  }

  for(const sp of bonusSprings){
    if(sp.squash > 0) sp.squash *= 0.85;
    if(sp.squash < 0.5) sp.squash = 0;
  }

  if(bonusPhase === 'finish'){
    bonusFinishTimer--;
    stepConfetti();
    if(bonusFinishTimer <= 0){
      restoreL1State(bonusTotalPts);
    }
    return;
  }

  bonusTimer--;
  if(bonusTimer === 180 || bonusTimer === 120 || bonusTimer === 60){
    sfx('select');
  }

  if(bonusTimer <= 0){
    bonusTimer = 0;
    bonusPhase = 'finish';
    bonusFinishTimer = 120;
    sfx('trophy');
    winJingle();
    confetti = [];
    for(let i = 0; i < 60; i++){
      confetti.push({
        x: WNAT/2 + (Math.random() - 0.5) * 400,
        y: -10,
        vx: (Math.random() - 0.5) * 4,
        vy: 1.5 + Math.random() * 3,
        r: 0,
        vr: 0.1,
        c: [COL.hud, COL.gold, COL.cyan, COL.pink, '#FFFFFF'][Math.floor(Math.random() * 5)],
        s: Math.random() > 0.5 ? 'r' : 'c',
        w: 6 + Math.random() * 4
      });
    }
    return;
  }

  if(bonusComboTimer > 0){
    bonusComboTimer--;
    if(bonusComboTimer === 0){
      bonusCombo = 1;
    }
  }

  for(const pk of bonusPickups){
    if(pk.t === 'wheel' && pk.taken){
      pk.respawnTimer++;
      if(pk.respawnTimer > 210){
        pk.taken = false;
        pk.respawnTimer = 0;
        bonusFx.push({t:'star', x: pk.x, y: pk.y, age: 0, small: false});
        sfx('confirm');
      }
    }
  }

  if(bonusTimer < 660 && !bonusDiamondSpawned1){
    bonusDiamondSpawned1 = true;
    bonusPickups.push({t: 'diamond', x: -30, y: 95, vx: 2.2, basePts: 1000, taken: false, ph: 0});
  }
  if(bonusTimer < 240 && !bonusDiamondSpawned2){
    bonusDiamondSpawned2 = true;
    bonusPickups.push({t: 'diamond', x: WNAT + 30, y: 95, vx: -2.4, basePts: 1000, taken: false, ph: 0});
  }

  bonusRainTimer++;
  if(bonusRainTimer > 65){
    bonusRainTimer = 0;
    const rx1 = 80 + Math.random() * (WNAT - 160);
    const rx2 = 80 + Math.random() * (WNAT - 160);
    bonusPickups.push({t: 'cheese', x: rx1, y: -20, vy: 1.4, vx: (Math.random()-0.5)*0.8, basePts: 100, taken: false, ph: Math.random()*6, raining: true});
    bonusPickups.push({t: 'cheese', x: rx2, y: -20, vy: 1.4, vx: (Math.random()-0.5)*0.8, basePts: 100, taken: false, ph: Math.random()*6, raining: true});
  }

  for(let i = bonusPickups.length - 1; i >= 0; i--){
    const pk = bonusPickups[i];
    if(pk.vx) pk.x += pk.vx;
    if(pk.vy) pk.y += pk.vy;
    if(pk.raining && (pk.y > FEET + 30 || pk.taken)){
      bonusPickups.splice(i, 1);
      continue;
    }
    if(pk.t === 'diamond' && !pk.taken && ((pk.vx > 0 && pk.x > WNAT + 50) || (pk.vx < 0 && pk.x < -50))){
      bonusPickups.splice(i, 1);
      continue;
    }
  }

  for(const p of alivePlayers()){
    const s = srcCur[p.src] || {dx: 0, a: false, b: false};
    p.b.jheld = !!(s.a || s.b);

    const st = MOUSE_STATS[p.id];
    if(s.dx){
      p.b.vx += s.dx * ACC * (Math.sign(p.b.vx) !== s.dx && p.b.vx !== 0 ? 1.8 : 1);
      p.b.face = s.dx;
    } else {
      p.b.vx *= p.b.ground ? FR : 0.98;
    }
    const lim = st.maxv * 1.15;
    p.b.vx = Math.max(-lim, Math.min(lim, p.b.vx));
    if(Math.abs(p.b.vx) < 0.05) p.b.vx = 0;

    if(p.jq) p.b.buf = 7;
    p.jq = false;

    if(p.b.buf > 0){
      if(p.b.ground || p.b.coyote > 0){
        p.b.vy = -st.jv;
        p.b.ground = false;
        p.b.coyote = 0;
        p.b.buf = 0;
        sfx('jump');
      } else if(st.dbl && !p.b.dbl){
        p.b.vy = -st.jv * 0.9;
        p.b.dbl = true;
        p.b.buf = 0;
        sfx('jump2');
      }
      p.b.buf--;
    }

    p.b.vy += (p.b.jheld && p.b.vy < 0) ? GH : GL;
    if(p.b.vy > 15) p.b.vy = 15;

    p.b.x += p.b.vx;
    if(p.b.x < 32){
      p.b.x = 32;
      if(p.b.vx < -1.5){
        p.b.vx = -p.b.vx * 0.9;
        sfx('hop');
        bonusFx.push({t:'spark', x: 30, y: p.b.y - 40, age: 0});
      } else p.b.vx = 0;
    } else if(p.b.x > WNAT - 32){
      p.b.x = WNAT - 32;
      if(p.b.vx > 1.5){
        p.b.vx = -p.b.vx * 0.9;
        sfx('hop');
        bonusFx.push({t:'spark', x: WNAT - 30, y: p.b.y - 40, age: 0});
      } else p.b.vx = 0;
    }

    const wasGround = p.b.ground;
    p.b.ground = false;
    p.b.y += p.b.vy;

    if(p.b.y >= FEET){
      p.b.y = FEET;
      p.b.vy = 0;
      p.b.ground = true;
    }

    for(const sh of bonusShelves){
      if(p.b.vy >= 0 && (p.b.y - p.b.vy <= sh.y + 4) && p.b.y >= sh.y){
        if(p.b.x > sh.x - 12 && p.b.x < sh.x + sh.w + 12){
          p.b.y = sh.y;
          p.b.vy = 0;
          p.b.ground = true;
        }
      }
    }

    for(const sp of bonusSprings){
      const spCenter = sp.x + sp.w/2;
      if(Math.abs(p.b.x - spCenter) < sp.w/2 + 8){
        if(p.b.y >= sp.y && p.b.y - p.b.vy <= sp.y + 16 && p.b.vy >= 0){
          sp.squash = 14;
          const isSuper = (s.a || s.b) || p.b.buf > 0;
          if(isSuper){
            p.b.vy = sp.superPower;
            sfx('spring_super');
            bonusFx.push({t:'pts', x: spCenter, y: sp.y - 30, txt: 'SUPER BOUNCE!', age: 0, big: true, col: COL.gold});
            bonusTotalPts += 50;
            for(let k = 0; k < 6; k++) bonusFx.push({t:'spark', x: spCenter + (Math.random()-0.5)*30, y: sp.y - 10, age: -k*2});
          } else {
            p.b.vy = sp.power;
            sfx('spring');
          }
          p.b.ground = false;
          p.b.buf = 0;
          p.b.dbl = false;
        }
      }
    }

    if(p.b.ground){
      p.b.dbl = false;
      p.b.coyote = 6;
      if(Math.abs(p.b.vx) > 0.2) p.b.walk += Math.abs(p.b.vx); else p.b.walk = 0;
    } else if(wasGround && p.b.vy >= 0){
      p.b.coyote = 6;
    } else if(p.b.coyote > 0){
      p.b.coyote--;
    }

    const h = HIT_H[p.id] || 86;
    for(const pk of bonusPickups){
      if(pk.taken) continue;
      const dist = Math.hypot(p.b.x - pk.x, (p.b.y - h/2) - pk.y);
      if(dist < 34){
        pk.taken = true;
        bonusComboTimer = 110;
        bonusCombo = Math.min(8, bonusCombo + 1);
        if(bonusCombo > bonusMaxCombo) bonusMaxCombo = bonusCombo;
        sfxCombo(bonusCombo);

        const pts = pk.basePts * bonusCombo;
        bonusTotalPts += pts;

        bonusFx.push({
          t: 'pts',
          x: pk.x,
          y: pk.y - 16,
          txt: '+' + pts,
          age: 0,
          big: (bonusCombo >= 4 || pk.basePts >= 500),
          col: pk.t === 'diamond' ? COL.cyan : (pk.basePts >= 500 ? COL.gold : '#FFFFFF')
        });

        if(bonusCombo >= 2){
          const comboTitle = bonusCombo === 8 ? '8x FRENZY!' :
                             bonusCombo >= 5 ? bonusCombo + 'x MEGA!' :
                             bonusCombo + 'x COMBO!';
          bonusFx.push({t: 'pts', x: pk.x, y: pk.y - 36, txt: comboTitle, age: 0, col: COL.hud});
        }

        if(pk.t === 'wheel' || pk.t === 'diamond'){
          bonusFx.push({t:'star', x: pk.x, y: pk.y, age: 0, small: false});
          sfx('cheese');
        } else {
          bonusFx.push({t:'spark', x: pk.x, y: pk.y, age: 0});
          sfx('cheese');
        }
      }
    }
  }
}

function drawSpringboard(sp){
  const x = sp.x, y = sp.y, w = sp.w, h = sp.h;
  const sq = sp.squash || 0;
  rrect(x + 2, y + h - 5, w - 4, 6, 2); ctx.fillStyle = '#2A2D34'; ctx.fill();
  rect(x + 6, y + h - 4, 3, 3, '#A0AAB2'); rect(x + w - 9, y + h - 4, 3, 3, '#A0AAB2');

  const coils = sp.mega ? 4 : 3;
  const springH = Math.max(4, 14 - sq);
  ctx.strokeStyle = sp.mega ? COL.gold : '#C5D1D9';
  ctx.lineWidth = sp.mega ? 4 : 3;
  ctx.beginPath();
  ctx.moveTo(x + w/2 - 12, y + h - 5);
  for(let k = 0; k < coils; k++){
    const cy = y + h - 5 - (k + 0.5) * (springH / coils);
    const cx = (k % 2 === 0) ? (x + w/2 + 12) : (x + w/2 - 12);
    ctx.lineTo(cx, cy);
  }
  ctx.lineTo(x + w/2, y + h - 5 - springH);
  ctx.stroke();

  const capY = y + h - 5 - springH - 8;
  rrect(x, capY, w, 10, 4);
  ctx.fillStyle = sp.mega ? '#FF3B30' : '#E67E22';
  ctx.fill();
  if(sp.mega){
    starPath(x + w/2, capY + 5, 5, 2.5, 5);
    ctx.fillStyle = COL.gold; ctx.fill();
  } else {
    rect(x + 8, capY + 2, 8, 6, '#F1C40F');
    rect(x + w - 16, capY + 2, 8, 6, '#F1C40F');
  }
}

function drawBonusShelf(sh){
  rrect(sh.x, sh.y, sh.w, sh.h, 4);
  ctx.fillStyle = '#6E2C16'; ctx.fill();
  rect(sh.x + 2, sh.y, sh.w - 4, 3, '#A04A28');
  rect(sh.x, sh.y + sh.h - 3, sh.w, 3, '#42170B');
  for(const bx of [sh.x + 16, sh.x + sh.w - 24]){
    ctx.fillStyle = '#B8860B';
    ctx.beginPath();
    ctx.moveTo(bx, sh.y + sh.h);
    ctx.lineTo(bx + 8, sh.y + sh.h);
    ctx.lineTo(bx, sh.y + sh.h + 16);
    ctx.closePath();
    ctx.fill();
  }
}

function drawCheeseWheel(x, y){
  const bob = Math.sin(frame * 0.08) * 4;
  const cy = y + bob;
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.15 * Math.sin(frame * 0.1);
  disc(x, cy, 32, 24, '#FFE680');
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#D4AC0D';
  ctx.beginPath();
  ctx.ellipse(x, cy + 8, 24, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  rect(x - 24, cy, 48, 8, '#F1C40F');
  ctx.fillStyle = '#F9E79F';
  ctx.beginPath();
  ctx.ellipse(x, cy, 24, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#D4AC0D';
  ctx.beginPath();
  ctx.moveTo(x, cy);
  ctx.lineTo(x + 18, cy + 4);
  ctx.lineTo(x + 14, cy + 14);
  ctx.lineTo(x, cy + 8);
  ctx.closePath();
  ctx.fill();
  disc(x - 10, cy - 2, 4, 2, '#B7950B');
  disc(x + 4, cy - 4, 3, 1.5, '#B7950B');
  disc(x - 14, cy + 5, 3.5, 2, '#9A7D0A');
  disc(x + 6, cy + 6, 2.5, 1.5, '#9A7D0A');

function drawDiamondCheese(x, y){
  const bob = Math.sin(frame * 0.15) * 3;
  const cy = y + bob;
  ctx.save();
  ctx.globalAlpha = 0.4 + 0.2 * Math.sin(frame * 0.2);
  disc(x, cy, 28, 28, COL.cyan);
  disc(x, cy, 20, 20, '#FF69B4');
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#E0FFFF';
  ctx.beginPath();
  ctx.moveTo(x - 16, cy); ctx.lineTo(x, cy - 16); ctx.lineTo(x + 16, cy); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#00FFFF';
  ctx.beginPath();
  ctx.moveTo(x - 16, cy); ctx.lineTo(x, cy); ctx.lineTo(x, cy + 18); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#FF69B4';
  ctx.beginPath();
  ctx.moveTo(x + 16, cy); ctx.lineTo(x, cy); ctx.lineTo(x, cy + 18); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.moveTo(x, cy - 12); ctx.lineTo(x + 8, cy); ctx.lineTo(x, cy + 12); ctx.lineTo(x - 8, cy); ctx.closePath();
  ctx.fill();
  starPath(x + 6, cy - 6, 6, 2.5, 4); ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.restore();
}

function drawBonusFx(){
  for(const f of bonusFx){
    const a = f.age;
    if(f.t === 'star'){
      const k = Math.min(1, a / 10), r = (f.small ? 30 : 60) * (0.4 + 0.6 * k);
      ctx.globalAlpha = 1 - Math.max(0, (a - 12) / 10);
      starPath(f.x, f.y, r, r * 0.6, 8);
      ctx.fillStyle = 'rgba(255, 230, 100, 0.6)'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      ctx.globalAlpha = 1;
    } else if(f.t === 'spark'){
      if(a < 0) continue;
      ctx.globalAlpha = 1 - a / 25;
      starPath(f.x, f.y - a * 1.5, 7, 3, 4);
      ctx.fillStyle = COL.gold; ctx.fill();
      ctx.globalAlpha = 1;
    } else if(f.t === 'pts'){
      ctx.globalAlpha = 1 - Math.max(0, (a - 20) / 25);
      const col = f.col || (f.big ? COL.gold : '#FFFFFF');
      const sc = f.big ? 3 : 2;
      text(f.txt, f.x, f.y - a * 1.2, sc, col, 'c', '#000', true);
      ctx.globalAlpha = 1;
    }
  }
}

function renderBonus(){
  ctx.save();
  drawBonusScenery();

  for(const sh of bonusShelves) drawBonusShelf(sh);
  for(const sp of bonusSprings) drawSpringboard(sp);

  for(const pk of bonusPickups){
    if(pk.taken) continue;
    if(pk.t === 'wheel') drawCheeseWheel(pk.x, pk.y);
    else if(pk.t === 'diamond') drawDiamondCheese(pk.x, pk.y);
    else if(pk.t === 'apple') drawApple(pk.x, pk.y + Math.sin(frame * 0.1 + pk.ph) * 3);
    else drawCheese(pk.x, pk.y + Math.sin(frame * 0.1 + pk.ph) * 3);
  }

  drawPlayers();
  drawBonusFx();

  if(bonusPhase === 'finish'){
    for(const p of confetti){
      ctx.save(); ctx.translate(R(p.x), R(p.y)); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if(p.s === 'r') ctx.fillRect(-p.w/2, -3, p.w, 6);
      else { ctx.beginPath(); ctx.arc(0, 0, p.w/2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
  }
  ctx.restore();

  // Top HUD Bar
  rrect(20, 8, 170, 34, 6); ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fill();
  ctx.strokeStyle = COL.hud; ctx.lineWidth = 1.5; ctx.stroke();
  text('BONUS', 30, 12, 1.4, COL.hud, 'l');
  text('+' + bonusTotalPts, 30, 22, 2.4, COL.gold, 'l');

  const sec = Math.max(0, bonusTimer / 60).toFixed(1);
  const isLow = bonusTimer < 180 && bonusTimer > 0;
  const timerCol = isLow ? ((Math.floor(frame / 6) % 2 === 0) ? '#FF3333' : '#FFD700') : COL.hud;
  rrect(WNAT/2 - 70, 8, 140, 34, 6); ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fill();
  ctx.strokeStyle = timerCol; ctx.lineWidth = 2; ctx.stroke();
  text('TIME  ' + sec + 's', WNAT/2, 16, 2.6, timerCol, 'c', '#000', true);

  rrect(WNAT - 190, 8, 170, 34, 6); ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fill();
  ctx.strokeStyle = (bonusCombo >= 4) ? COL.hud : COL.gold; ctx.lineWidth = 1.5; ctx.stroke();
  text('COMBO', WNAT - 180, 12, 1.4, COL.hud, 'l');
  text(bonusCombo + 'x', WNAT - 35, 12, 2.6, (bonusCombo >= 5) ? COL.hud : COL.gold, 'r', '#000');
  const comboRatio = Math.max(0, bonusComboTimer / 110);
  rect(WNAT - 180, 30, 150 * comboRatio, 6, (bonusCombo >= 5) ? COL.hud : COL.gold);

  if(bonusPhase === 'finish'){
    rrect(WNAT/2 - 200, 115, 400, 170, 14); ctx.fillStyle = 'rgba(0,0,0,0.92)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = COL.gold; ctx.stroke();
    text('★ BONUS COMPLETE! ★', WNAT/2, 132, 3.8, COL.gold, 'c', null, true);
    text('TIME EXPIRED!', WNAT/2, 166, 2.2, '#FFFFFF', 'c');
    text('TOTAL BONUS: +' + bonusTotalPts, WNAT/2, 202, 3.8, COL.hud, 'c', null, true);
    text('MAX COMBO: ' + bonusMaxCombo + 'x', WNAT/2, 240, 2.4, COL.gold, 'c');
  }
}

  ctx.strokeStyle = '#FBC02D'; ctx.lineWidth = 3;
  ctx.strokeRect(deckX + 2, y - 18, deckW - 4, 18);
  rect(deckX + 6, y - 16, 3, 16, '#E53935');

  // Peaked Roof Canopy over Deck
  ctx.fillStyle = '#E53935'; ctx.beginPath();
  ctx.moveTo(deckX - 6, y - 18);
  ctx.lineTo(deckX + deckW / 2, y - 36);
  ctx.lineTo(deckX + deckW + 6, y - 18);
  ctx.closePath(); ctx.fill();
  rect(deckX - 6, y - 18, deckW + 12, 3, '#FFCDD2');

  // 2. Climbable Ladder on Left
  ctx.strokeStyle = '#37474F'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(ladderX, y + h); ctx.lineTo(deckX + 2, y + 2);
  ctx.moveTo(ladderX + 16, y + h); ctx.lineTo(deckX + 12, y + 2);
  ctx.stroke();
  for(let ly = y + 16; ly < y + h - 6; ly += 14){
    const t = (ly - y) / h;
    const rx = (deckX + 2) * (1 - t) + ladderX * t;
    rect(rx + 2, ly, 14, 4, '#FBC02D');
  }

  // 3. Chute Steel Support Pillars
  rect(chuteX + chuteW * 0.42, y + 42, 6, h - 42, '#37474F');
  rect(chuteX + chuteW * 0.82, y + 84, 6, h - 84, '#37474F');

  // 4. Curved Slide Chute (Outer Tube + High-Gloss Slide Surface)
  ctx.strokeStyle = '#00BCD4'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(chuteX, y + 8);
  ctx.quadraticCurveTo(chuteX + chuteW * 0.35, y + 20, chuteX + chuteW, y + h - 4);
  ctx.stroke();

  ctx.strokeStyle = '#80DEEA'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(chuteX, y + 8);
  ctx.quadraticCurveTo(chuteX + chuteW * 0.35, y + 20, chuteX + chuteW, y + h - 4);
  ctx.stroke();

  // Slide entrance hood
  rect(chuteX - 3, y - 6, 8, 16, '#0097A7');
  ctx.restore();
}
